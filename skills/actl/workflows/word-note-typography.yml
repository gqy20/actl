                                                  "role:Document",
                                                  "主题:用 actl CLI 在 Word 里写一篇笔记并保存到桌面",
                                                  "--property",
                                                  "text",
                                                  "--contains",
                                                  "--app",
                                                  {
                                                      "input":  "app"
                                                  }
                                              ],
                                     "command":  "verify"
