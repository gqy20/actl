                                  "sequence":  [
                                                   {
                                                       "command":  "press",
                                                       "args":  [
                                                                    "enter",
                                                                    "--target",
                                                                    "role:Document",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
