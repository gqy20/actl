                                                  "笔记 2026-10-04\n主题:用 actl CLI 在 Word 里写一篇笔记并保存到桌面\n过程记录:\n① 先探测再动手:桌面真实路径是 D:\\C\\Desktop(用户目录经过重定向),不能按默认的 C:\\Users 路径猜;\n② 复制样式模板 docx 作为独立文档,launch /n 打开,等待 role:Document 就绪;\n③ 逐段编舞:回车开新段,剪贴板粘贴正文,光标处按 Ctrl+Alt+N 应用标题样式;\n④ ctrl+s 原地保存;关闭重开后用 verify-file --kind docx-styles 逐段断言样式。\n心得:\n• 样式定义预置在模板,运行时只应用不修改,字体/字号/行距一处定义全文生效;\n• 逐段断言用 docx-styles 的 styleId 比对,机器可验,不依赖视觉;\n• 启动期错误框经 popup_handlers 声明由引擎弹层治理自动处置。\n(本笔记由 actl 样式流程输入并保存)",
