                                                   {
                                                       "command":  "press",
                                                       "args":  [
                                                                    "ctrl+v",
                                                                    "--target",
                                                                    "role:Document",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
                                                   }
