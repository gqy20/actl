{
    "version":  1,
    "name":  "Word 笔记样式排版",
    "handoff":  {
                    "approval":  "once_per_run"
                },
    "popup_handlers":  [
                           {
                               "app":  ".docx",
                               "classification":  "error",
                               "name_contains":  "目录名无效",
                               "click":  "id:2"
                           }
                       ],
    "inputs":  {
                   "program":  {
                                   "default":  "${env:ProgramFiles}/Microsoft Office/Root/Office16/WINWORD.EXE"
                               },
                   "file":  {
                                "default":  "${run.dir}/${run.id}.docx"
                            },
                   "app":  {
                               "default":  "${run.id}.docx"
                           }
               },
    "steps":  [
                  {
                      "id":  "open",
                      "title":  "打开样式模板副本",
                      "run":  {
                                  "command":  "launch",
                                  "args":  [
                                               {
                                                   "input":  "program"
                                               },
                                               "/n",
                                               {
                                                   "input":  "file"
                                               }
                                           ]
                              },
                      "verify":  {
                                     "command":  "wait",
                                     "args":  [
                                                  "--element",
                                                  "role:Document",
                                                  "--app",
                                                  {
                                                      "input":  "app"
                                                  },
                                                  "--timeout",
                                                  "30000"
                                              ]
                                 }
                  },
                  {
                      "id":  "ownership",
                      "title":  "核对任务进程归属",
                      "run":  {
                                  "command":  "verify-owner",
                                  "args":  [
                                               "--app",
                                               {
                                                   "input":  "app"
                                               },
                                               "--program",
                                               {
                                                   "input":  "program"
                                               },
                                               "--token",
                                               {
                                                   "input":  "file"
                                               }
                                           ]
                              },
                      "outputs":  {
                                      "hwnd":  {
                                                   "pointer":  "/hwnd",
                                                   "type":  "number"
                                               },
                                      "pid":  {
                                                  "pointer":  "/pid",
                                                  "type":  "number"
                                              },
                                      "start":  {
                                                    "pointer":  "/process_start",
                                                    "type":  "string"
                                                }
                                  }
                  },
                  {
                      "id":  "focus",
                      "title":  "建立正文焦点并清空模板段",
                      "run":  {
                                  "sequence":  [
                                                   {
                                                       "command":  "type",
                                                       "args":  [
                                                                    "role:Document",
                                                                    " ",
                                                                    "--paste",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
                                                   },
                                                   {
                                                       "command":  "press",
                                                       "args":  [
                                                                    "ctrl+a",
                                                                    "--target",
                                                                    "role:Document",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
                                                   },
                                                   {
                                                       "command":  "press",
                                                       "args":  [
                                                                    "backspace",
                                                                    "--target",
                                                                    "role:Document",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
                                                   }
                                               ]
                              },
                      "verify":  {
                                     "args":  [
                                                  "--value",
                                                  "role:Document",
                                                  "",
                                                  "--property",
                                                  "text",
                                                  "--normalize-lines",
                                                  "--app",
                                                  {
                                                      "input":  "app"
                                                  }
                                              ],
                                     "command":  "verify"
                                 }
                  },
                  {
                      "id":  "para-title",
                      "title":  "标题段(标题1样式)",
                      "run":  {
                                  "sequence":  [
                                                   {
                                                       "command":  "set-clipboard",
                                                       "args":  [
                                                                    "笔记 2026-10-04"
                                                                ]
                                                   },
                                                   {
                                                       "command":  "press",
                                                       "args":  [
                                                                    "ctrl+v",
                                                                    "--target",
                                                                    "role:Document",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
                                                   },
                                                   {
                                                       "command":  "press",
                                                       "args":  [
                                                                    "ctrl+alt+1",
                                                                    "--target",
                                                                    "role:Document",
                                                                    "--app",
                                                                    {
                                                                        "input":  "app"
                                                                    }
                                                                ]
                                                   }
                                               ]
                              },
                      "verify":  {
                                     "args":  [
                                                  "--value",
                                                  "role:Document",
                                                  "笔记 2026-10-04",
                                                  "--property",
                                                  "text",
                                                  "--contains",
                                                  "--app",
                                                  {
                                                      "input":  "app"
                                                  }
                                              ],
                                     "command":  "verify"
                                 }
                  },
                  {
                      "id":  "para-subject",
                      "title":  "副题段(正文)",
