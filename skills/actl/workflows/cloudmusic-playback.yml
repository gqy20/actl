{
  "version": 1,
  "name": "cloudmusic-playback",
  "handoff": {
    "approval": "once_per_run"
  },
  "inputs": {
    "app": {},
    "baseline": {
      "default": "play"
    },
    "alternate": {
      "default": "pause"
    },
    "baseline_predicate": {
      "default": "name=play"
    },
    "alternate_predicate": {
      "default": "name=pause"
    }
  },
  "steps": [
    {
      "id": "baseline",
      "title": "baseline",
      "run": {
        "command": "verify",
        "args": [
          "--value",
          "id:btn_pc_minibar_play",
          {
            "input": "baseline"
          },
          "--property",
          "name",
          "--app",
          {
            "input": "app"
          }
        ]
      }
    },
    {
      "id": "1-uia-toggle",
      "title": "1 uia toggle",
      "run": {
        "command": "click",
        "args": [
          "id:btn_pc_minibar_play",
          "--app",
          {
            "input": "app"
          }
        ]
      },
      "verify": {
        "command": "wait",
        "args": [
          "--element",
          "id:btn_pc_minibar_play",
          "--property",
          {
            "input": "alternate_predicate"
          },
          "--timeout",
          "5000",
          "--app",
          {
            "input": "app"
          }
        ]
      },
      "before": {
        "command": "verify",
        "args": [
          "--value",
          "id:btn_pc_minibar_play",
          {
            "input": "baseline"
          },
          "--property",
          "name",
          "--app",
          {
            "input": "app"
          }
        ]
      },
      "resume_check": {
        "command": "verify",
        "args": [
          "--value",
          "id:btn_pc_minibar_play",
          {
            "input": "baseline"
          },
          "--property",
          "name",
          "--app",
          {
            "input": "app"
          }
        ]
      }
    },
