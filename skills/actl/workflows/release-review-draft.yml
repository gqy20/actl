# yaml-language-server: $schema=../../schemas/flow-v1.schema.json
# 业务流程:CDP 自有 headless 会话读公开仓库 Releases 页,在 Word 种子文档
# 写入核对草稿并另存为落盘。全链记录见 docs/43。
# 前置条件:
#   1. 本机未打开其他 Word 窗口(launch 的窗口核验按标题子串匹配)
#   2. 网络可达 github.com
# 副作用与边界:
#   - type --paste 使用系统剪贴板,会覆盖当前剪贴板内容
#   - 草稿保存为 actl-release-draft.docx:另存为对话框默认目录跟随被打开
#     文档(即任务资源目录 ${run.dir}),同名覆盖——它是"当前核对状态",
#     不是历史留痕,需要留痕请自行改名归档
#   - 读段(前四步)只读且 headless 无窗口;写段从 open_word 检查点开始,
#     需要 actl 显示端的人工开始授权
#   - 私有仓库形态需要持久 profile+登录(真实需求出现再立)
version: 1
name: 生成 zotero_cli 发布页核对草稿
popup_handlers:
  # Word 每开文档弹「目录名无效 (N:\)」(word.yml quirk)——error 处置,点 OK
  - app: Word
    classification: error
    name_contains: 目录名无效
    click: id:2
popup_ignores:
  # F12 另存为对话框是 open_save_as 的产物、type_filename/confirm_save 的
  # 输入目标——自产目标表面走 ignores 放行(handlers 必须带 click 处置);
  # 对话框锚步(--app 另存为)的门禁定位也用它认领(owned 32770 对话框是
  # 独立标题窗口,Word 锚的 ignore 匹配不到它)
  - app: Word
    name_contains: 另存为
  - app: 另存为
    name_contains: 另存为
inputs:
  browser_executable:
    default: 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'
  # 目标发布页是环境相关参数:default 为占位形态,运行时 --inputs 覆盖
  # (打包纪律:skill 不焊死外域 URL)
  releases_url:
    default: 'https://<owner>/<repo>/releases'
  # launch 文件参数指向 resources 复制出的任务目录种子副本(绕过开始屏幕)
  word_file:
    default: '${run.dir}/${run.id}.docx'
resources:
  files:
    - copy: assets/seed.docx
      path: '${run.id}.docx'
steps:
  - id: launch_browser
    title: headless 自有会话打开发布页
    run:
      command: browser-launch
      args: ['--browser-executable', {input: browser_executable}, '--url', {input: releases_url}, '--headless', '--timeout', '25000']
    verify:
      command: browser-verify
      args: ['--newest-alive']
  - id: observe_session
    title: 只读发现会话句柄
    run:
      command: browser-list
    outputs:
      session_id:
        type: string
        pointer: /sessions/0/session_id
  - id: page_title
    title: 读取最新 release 标题(CDP 文档通道;--wait-for 2 沉降谓词覆盖 hpc 异步渲染)
    run:
      command: browser-read
      args: ['--session', placeholder, '--css', 'div[data-hpc] h2', '--all', '--wait-for', '2', '--timeout', '20000']
      bind: {'1': observe_session.session_id}
    outputs:
      page_title:
        type: string
        pointer: /elements/1/text
        max_age_ms: 1800000
  - id: close_browser
    title: 会话治理:读完即关(headless 无窗口,注销即清)
    run:
      command: browser-close
      args: ['--session', placeholder]
      bind: {'1': observe_session.session_id}
    verify:
      command: browser-verify
      args: ['--session', placeholder, '--gone']
      bind: {'1': observe_session.session_id}
  - id: open_word
    title: 打开 Word 种子副本并停在写前检查点(文件参数绕过开始屏幕;
      人工开始授权;无 resume_check——首跑 Word 未开,缺席类前置无法用
      verify 表达,launch 步自身的窗口核验即护栏)
    pause_before: true
    run:
      command: launch
      args: ['WINWORD', '/n', {input: word_file}]
    verify:
      command: wait
      args: ['--element', 'role:Document', '--app', 'Word', '--timeout', '20000']
  - id: write_header
    title: 写入草稿首行
    run:
      command: type
      args: ['role:Document', '发布核对记录：\n', '--paste', '--app', 'Word']
    verify:
      command: verify
      args: ['--value', 'role:Document', '发布核对记录', '--property', 'text', '--contains', '--app', 'Word']
  - id: write_title
    title: 写入来源标题行
    run:
      command: type
      args: ['role:Document', placeholder, '--paste', '--app', 'Word']
      bind: {'1': page_title.page_title}
    verify:
      command: verify
      args: ['--value', 'role:Document', placeholder, '--property', 'text', '--contains', '--app', 'Word']
      bind: {'2': page_title.page_title}
  - id: open_save_as
    title: 打开另存为对话框(文档已带任务目录路径,ctrl+s 会原地保存,用 F12;
      锚定对话框自身标题——owned 32770 类对话框是独立前台窗口,Word 主窗锚的
      type 前台守卫结构上无法对齐)
    run:
      command: press
      args: ['f12', '--app', 'Word']
    verify:
      command: wait
      args: ['--element', 'uia:{"match":{"role":"Edit","name":"文件名:"}}', '--app', '另存为', '--timeout', '8000']
  - id: type_filename
    title: 输入草稿文件名
    run:
      command: type
      args: ['uia:{"match":{"role":"Edit","name":"文件名:"}}', 'actl-release-draft.docx', '--paste', '--verify-value', 'actl-release-draft.docx', '--app', '另存为']
    verify:
      command: verify
      args: ['--value', 'uia:{"match":{"role":"Edit","name":"文件名:"}}', 'actl-release-draft.docx', '--property', 'value', '--app', '另存为']
  - id: confirm_save
    title: 在文件名框回车保存
    run:
      command: press
      args: ['enter', '--app', '另存为']
    verify:
      command: wait
      args: ['--window', 'actl-release-draft', '--timeout', '15000']
  - id: verify_draft
    title: 写后业务核验
    retry: stale_read
    run:
      command: verify
      args: ['--value', 'role:Document', placeholder, '--property', 'text', '--contains', '--app', 'Word']
      bind: {'2': page_title.page_title}
