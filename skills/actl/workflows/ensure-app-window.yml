version: 1
name: 复用或启动应用窗口
handoff: {approval: once_per_run}
inputs:
  app: {}
  program: {}
  ready_target: {}
steps:
  - id: ensure-window
    recovery: {max_retries: 2, timeout_ms: 3000, interval_ms: 200}
    title: 已有窗口则复用，否则启动
    when:
      command: verify-window
      args: [--app, {input: app}, --state, exists]
    run:
      command: verify-window
      args: [--app, {input: app}, --state, exists]
    otherwise:
      command: launch
      args: [{input: program}]
    verify:
      command: wait
      args: [--window, {input: app}, --timeout, '10000']
  - id: ensure-foreground
    title: 窗口未在前台时切换并核验
    recovery: {max_retries: 2, timeout_ms: 3000, interval_ms: 200}
    unless:
      command: verify-window
      args: [--app, {input: app}, --state, foreground]
    run:
      command: focus-window
      args: [{input: app}]
    verify:
      command: verify-window
      args: [--app, {input: app}, --state, foreground]
  - id: ensure-target-ready
    title: 等待业务目标出现并稳定
    run:
      command: wait
      args: [--element, {input: ready_target}, --stable, --app, {input: app}, --timeout, '15000']
