version: 1
name: 复用或启动应用窗口
handoff: {approval: once_per_run}
inputs:
  app: {}
  program: {}
  ready_target: {}
steps:
  # ensure: 幂等语义示范(运行时治理第二轮):check 通过 = 步骤已满足,
  # run 不派发直接 completed——重跑/修订续跑的前缀自动短路。
  - id: ensure-window
    title: 已有窗口则复用，否则启动
    ensure:
      check:
        command: verify-window
        args: [--app, {input: app}, --state, exists]
    run:
      command: launch
      args: [{input: program}]
    verify:
      command: wait
      args: [--window, {input: app}, --timeout, '10000']
  - id: ensure-foreground
    title: 已在前台则复用，否则切换并核验
    ensure:
      check:
        command: verify-window
        args: [--app, {input: app}, --state, foreground]
    run:
      command: focus-window
      args: [{input: app}]
    verify:
      command: verify-window
      args: [--app, {input: app}, --state, foreground]
  - id: ensure-target-ready
    title: 等待业务目标出现并稳定
    run:
      command: wait
      args: [--element, {input: ready_target}, --stable, --app, {input: app}, --timeout, '15000']
