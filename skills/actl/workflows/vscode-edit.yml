{
  "version": 1,
  "name": "vscode-edit",
  "handoff": {
    "approval": "once_per_run"
  },
  "inputs": {
    "program": {},
    "profile": {},
    "file": {},
    "app": {},
    "editor": {},
    "second": {},
    "second_editor": {}
  },
  "steps": [
    {
      "title": "Open isolated editor",
      "run": {
        "command": "launch",
        "args": [
          {
            "input": "program"
          },
          "--new-window",
          "--disable-extensions",
          "--skip-welcome",
          "--skip-release-notes",
          "--force-renderer-accessibility",
          "--user-data-dir",
          {
            "input": "profile"
          },
          {
            "input": "file"
          }
        ]
      },
      "verify": {
        "command": "wait",
        "args": [
          "--element",
          {
            "input": "editor"
          },
          "--app",
          {
            "input": "app"
          },
          "--timeout",
          "20000"
        ]
      },
      "id": "open"
    },
    {
      "run": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--program",
          {
            "input": "program"
          },
          "--token",
          {
            "input": "profile"
          }
        ]
      },
      "id": "ownership",
      "title": "Verify isolated task process",
      "outputs": {
        "pid": {
          "type": "number",
          "pointer": "/pid"
        },
        "hwnd": {
          "type": "number",
          "pointer": "/hwnd"
        },
        "start": {
          "type": "string",
          "pointer": "/process_start"
        }
      }
    },
    {
      "run": {
        "sequence": [
          {
            "command": "press",
            "args": [
              "ctrl+home",
              "--target",
              {
                "input": "editor"
              },
              "--app",
              {
                "input": "app"
              }
            ]
          },
          {
            "command": "type",
            "args": [
              {
                "input": "editor"
              },
              "Round 1 中文 789\n",
              "--paste",
              "--app",
              {
                "input": "app"
              }
            ]
          },
          {
            "command": "press",
            "args": [
              "ctrl+s",
              "--target",
              {
                "input": "editor"
              },
              "--app",
              {
                "input": "app"
              }
            ]
          }
        ]
      },
      "title": "insert 1 and verify full file",
      "resume_check": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--program",
          {
            "input": "program"
          },
          "--token",
          {
            "input": "profile"
          }
        ]
      },
      "verify": {
        "command": "verify-file",
        "args": [
          "--path",
          {
            "input": "file"
          },
          "--kind",
          "text",
          "--expected",
          "\"Round 1 中文 789\\nOriginal 中文 baseline 123\\nSecond line\\n\"",
          "--subset"
