{
  "version": 1,
  "name": "vscode-edit",
  "handoff": {
    "approval": "once_per_run"
  },
  "inputs": {
    "program": {
      "default": "${env:LOCALAPPDATA}/Programs/Microsoft VS Code/Code.exe"
    },
    "profile": {
      "default": "${run.dir}/profile"
    },
    "file": {
      "default": "${run.dir}/${run.id}.txt"
    },
    "app": {
      "default": "${run.id}"
    },
    "editor": {
      "default": "uia:{\"match\":{\"role\":\"Edit\",\"name_contains\":\"${run.id}.txt\"}}"
    },
    "second": {
      "default": "${run.dir}/${run.id}-second.txt"
    },
    "second_editor": {
      "default": "uia:{\"match\":{\"role\":\"Edit\",\"name_contains\":\"${run.id}-second.txt\"}}"
    },
    "file_result": {
      "default": "uia:{\"match\":{\"role\":\"ListItem\",\"name_contains\":\"${run.id}.txt\"},\"within\":{\"id\":\"quickInput_list\"}}"
    },
    "second_result": {
      "default": "uia:{\"match\":{\"role\":\"ListItem\",\"name_contains\":\"${run.id}-second.txt\"},\"within\":{\"id\":\"quickInput_list\"}}"
    }
  },
  "steps": [
    {
      "title": "Open isolated editor",
      "run": {
        "command": "launch",
        "args": [
          {
            "input": "program"
          },
          "--locale",
          "en",
          "--new-window",
          "--disable-extensions",
          "--skip-welcome",
          "--skip-release-notes",
          "--force-renderer-accessibility",
          "--user-data-dir",
          {
            "input": "profile"
          },
          {
            "input": "file"
          }
        ]
      },
      "verify": {
        "command": "wait",
        "args": [
          "--window",
          {
            "input": "app"
          },
          "--timeout",
          "20000"
        ]
      },
      "id": "open"
    },
    {
      "run": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--program",
          {
            "input": "program"
          },
          "--token",
          {
            "input": "profile"
          }
        ]
      },
      "id": "ownership",
      "title": "Verify isolated task process",
      "outputs": {
        "pid": {
          "type": "number",
          "pointer": "/pid"
        },
        "hwnd": {
          "type": "number",
          "pointer": "/hwnd"
        },
        "start": {
          "type": "string",
          "pointer": "/process_start"
        }
      }
    },
    {
      "id": "initial-foreground",
      "title": "Ensure owned window is foreground",
      "unless": {
        "command": "verify-window",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--state",
          "foreground"
        ]
      },
      "before": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--program",
          {
            "input": "program"
          },
          "--token",
          {
            "input": "profile"
          }
        ]
      },
      "run": {
        "command": "focus-window",
        "args": [
          {
            "input": "app"
          }
        ]
      },
      "verify": {
        "command": "verify-window",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--state",
          "foreground"
        ]
      }
    },
    {
      "id": "initial-ready",
      "title": "Wait for editor content and verify complete text",
      "run": {
        "sequence": [
          {
            "args": [
              "--element",
              "uia:{\"match\":{\"role\":\"MenuItem\",\"name\":\"File\"}}",
              "--app",
              {
                "input": "app"
              },
              "--timeout",
              "5000"
            ],
            "command": "wait"
          },
          {
            "command": "wait",
            "args": [
              "--element",
              {
                "input": "editor"
              },
              "--stable",
              "--app",
              {
                "input": "app"
              },
              "--timeout",
              "15000"
            ]
          }
        ]
      },
      "verify": {
        "command": "verify",
        "args": [
          "--value",
          {
            "input": "editor"
          },
          "Original 中文 baseline 123\nSecond line\n",
          "--property",
          "text",
          "--app",
          {
            "input": "app"
          }
        ]
      }
    },
    {
      "run": {
        "sequence": [
          {
            "command": "press",
            "args": [
              "ctrl+home",
              "--target",
              {
                "input": "editor"
              },
              "--app",
              {
                "input": "app"
              }
            ]
          },
          {
            "command": "type",
            "args": [
              {
                "input": "editor"
              },
              "Round 1 中文 789\n",
              "--paste",
              "--app",
              {
                "input": "app"
              }
            ]
          },
          {
            "args": [
              "uia:{\"match\":{\"name\":\"File\",\"role\":\"MenuItem\"}}",
              "--app",
              {
                "input": "app"
              }
            ],
            "command": "click"
          },
          {
            "args": [
              "--element",
              "uia:{\"match\":{\"name\":\"Save Ctrl+S\",\"role\":\"MenuItem\"}}",
              "--app",
              {
                "input": "app"
              },
              "--timeout",
              "5000"
            ],
            "command": "wait"
          },
          {
            "args": [
              "uia:{\"match\":{\"name\":\"Save Ctrl+S\",\"role\":\"MenuItem\"}}",
              "--app",
              {
                "input": "app"
              }
            ],
            "command": "click"
          }
        ]
      },
      "title": "insert 1 and verify full file",
      "resume_check": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "app"
          },
          "--program",
          {
            "input": "program"
          },
          "--token",
          {
            "input": "profile"
          }
        ]
      },
      "verify": {
        "command": "verify-file",
        "args": [
          "--path",
          {
            "input": "file"
          },
          "--kind",
          "text",
          "--expected",
          "\"Round 1 中文 789\\nOriginal 中文 baseline 123\\nSecond line\\n\"",
          "--subset"
        ]
      },
