{
  "version": 1,
  "name": "Application verification",
  "handoff": {
    "approval": "once_per_run"
  },
  "inputs": {
    "vscode-edit-program": {
      "default": "${env:LOCALAPPDATA}/Programs/Microsoft VS Code/Code.exe"
    },
    "vscode-edit-profile": {
      "default": "${run.dir}/vscode-edit/profile"
    },
    "vscode-edit-file": {
      "default": "${run.dir}/vscode-edit/${run.id}-vscode-edit.txt"
    },
    "vscode-edit-app": {
      "default": "${run.id}-vscode-edit"
    },
    "vscode-edit-editor": {
      "default": "uia:{\"match\":{\"role\":\"Edit\",\"name_contains\":\"${run.id}-vscode-edit.txt\"}}"
    },
    "vscode-edit-second": {
      "default": "${run.dir}/vscode-edit/${run.id}-vscode-edit-second.txt"
    },
    "vscode-edit-second_editor": {
      "default": "uia:{\"match\":{\"role\":\"Edit\",\"name_contains\":\"${run.id}-vscode-edit-second.txt\"}}"
    },
    "vscode-edit-file_result": {
      "default": "uia:{\"match\":{\"role\":\"ListItem\",\"name_contains\":\"${run.id}-vscode-edit.txt\"},\"within\":{\"id\":\"quickInput_list\"}}"
    },
    "vscode-edit-second_result": {
      "default": "uia:{\"match\":{\"role\":\"ListItem\",\"name_contains\":\"${run.id}-vscode-edit-second.txt\"},\"within\":{\"id\":\"quickInput_list\"}}"
    },
    "excel-table-program": {
      "default": "${env:ProgramFiles}/Microsoft Office/Root/Office16/EXCEL.EXE"
    },
    "excel-table-file": {
      "default": "${run.dir}/excel-table/${run.id}-excel-table.xlsx"
    },
    "excel-table-app": {
      "default": "${run.id}-excel-table"
    },
    "word-edit-program": {
      "default": "${env:ProgramFiles}/Microsoft Office/Root/Office16/WINWORD.EXE"
    },
    "word-edit-file": {
      "default": "${run.dir}/word-edit/${run.id}-word-edit.docx"
    },
    "word-edit-app": {
      "default": "${run.id}-word-edit"
    },
    "zotero-search-program": {
      "default": "${env:ProgramFiles}/Zotero/zotero.exe"
    },
    "zotero-search-profile": {
      "default": "${run.dir}/zotero-search/profile"
    },
    "zotero-search-data": {
      "default": "${run.dir}/zotero-search/data"
    },
    "zotero-search-app": {
      "default": "Zotero"
    },
    "zotero-search-export": {
      "default": "${run.dir}/zotero-search/export.json"
    }
  },
  "resources": {
    "files": [
      {
        "path": "vscode-edit/${run.id}-vscode-edit.txt",
        "text": "Original 中文 baseline 123\nSecond line\n"
      },
      {
        "path": "vscode-edit/${run.id}-vscode-edit-second.txt",
        "text": "Second owned file\n"
      },
      {
        "path": "excel-table/${run.id}-excel-table.xlsx",
        "copy": "assets/seed.xlsx"
      },
      {
        "path": "word-edit/${run.id}-word-edit.docx",
        "copy": "assets/seed.docx"
      },
      {
        "path": "zotero-search/profile/user.js",
        "text": "user_pref(\"extensions.zotero.httpServer.enabled\", false);\nuser_pref(\"extensions.zotero.sync.autoSync\", false);\nuser_pref(\"extensions.zotero.firstRun2\", false);\nuser_pref(\"extensions.zotero.firstRunGuidance\", false);\n"
      }
    ],
    "directories": [
      "vscode-edit/profile",
      "zotero-search/profile",
      "zotero-search/data"
    ]
  },
  "steps": [
    {
      "title": "Open isolated editor",
      "run": {
        "command": "launch",
        "args": [
          {
            "input": "vscode-edit-program"
          },
          "--new-window",
          "--disable-extensions",
          "--skip-welcome",
          "--skip-release-notes",
          "--force-renderer-accessibility",
          "--user-data-dir",
          {
            "input": "vscode-edit-profile"
          },
          {
            "input": "vscode-edit-file"
          }
        ]
      },
      "verify": {
        "command": "wait",
        "args": [
          "--window",
          {
            "input": "vscode-edit-app"
          },
          "--timeout",
          "20000"
        ]
      },
      "id": "vscode-edit-open"
    },
    {
      "run": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--program",
          {
            "input": "vscode-edit-program"
          },
          "--token",
          {
            "input": "vscode-edit-profile"
          }
        ]
      },
      "id": "vscode-edit-ownership",
      "title": "Verify isolated task process",
      "outputs": {
        "pid": {
          "type": "number",
          "pointer": "/pid"
        },
        "hwnd": {
          "type": "number",
          "pointer": "/hwnd"
        },
        "start": {
          "type": "string",
          "pointer": "/process_start"
        }
      }
    },
    {
      "id": "vscode-edit-initial-foreground",
      "title": "Ensure owned window is foreground",
      "unless": {
        "command": "verify-window",
        "args": [
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--state",
          "foreground"
        ]
      },
      "before": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--program",
          {
            "input": "vscode-edit-program"
          },
          "--token",
          {
            "input": "vscode-edit-profile"
          }
        ]
      },
      "run": {
        "command": "focus-window",
        "args": [
          {
            "input": "vscode-edit-app"
          }
        ]
      },
      "verify": {
        "command": "verify-window",
        "args": [
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--state",
          "foreground"
        ]
      }
    },
    {
      "id": "vscode-edit-initial-ready",
      "title": "Wait for editor content and verify complete text",
      "run": {
        "command": "wait",
        "args": [
          "--element",
          {
            "input": "vscode-edit-editor"
          },
          "--stable",
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--timeout",
          "15000"
        ]
      },
      "verify": {
        "command": "verify",
        "args": [
          "--value",
          {
            "input": "vscode-edit-editor"
          },
          "Original 中文 baseline 123\nSecond line\n",
          "--property",
          "text",
          "--app",
          {
            "input": "vscode-edit-app"
          }
        ]
      }
    },
    {
      "run": {
        "sequence": [
          {
            "command": "press",
            "args": [
              "ctrl+home",
              "--target",
              {
                "input": "vscode-edit-editor"
              },
              "--app",
              {
                "input": "vscode-edit-app"
              }
            ]
          },
          {
            "command": "type",
            "args": [
              {
                "input": "vscode-edit-editor"
              },
              "Round 1 中文 789\n",
              "--paste",
              "--app",
              {
                "input": "vscode-edit-app"
              }
            ]
          },
          {
            "command": "press",
            "args": [
              "ctrl+s",
              "--target",
              {
                "input": "vscode-edit-editor"
              },
              "--app",
              {
                "input": "vscode-edit-app"
              }
            ]
          }
        ]
      },
      "title": "insert 1 and verify full file",
      "resume_check": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--program",
          {
            "input": "vscode-edit-program"
          },
          "--token",
          {
            "input": "vscode-edit-profile"
          }
        ]
      },
      "verify": {
        "command": "verify-file",
        "args": [
          "--path",
          {
            "input": "vscode-edit-file"
          },
          "--kind",
          "text",
          "--expected",
          "\"Round 1 中文 789\\nOriginal 中文 baseline 123\\nSecond line\\n\"",
          "--subset"
        ]
      },
      "id": "vscode-edit-insert-1",
      "before": {
        "command": "verify-owner",
        "args": [
          "--app",
          {
            "input": "vscode-edit-app"
          },
          "--program",
          {
            "input": "vscode-edit-program"
          },
          "--token",
          {
            "input": "vscode-edit-profile"
          }
