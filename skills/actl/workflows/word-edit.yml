version: 1
name: Word 正文编辑与磁盘核验
handoff:
  approval: once_per_run
inputs:
  program:
    default: '${env:ProgramFiles}/Microsoft Office/Root/Office16/WINWORD.EXE'
  file:
    default: '${run.dir}/${run.id}.docx'
  app:
    default: '${run.id}'
steps:
  - id: open
    title: 打开任务文档
    run:
      command: launch
      args:
        - input: program
        - /n
        - input: file
    verify:
      command: wait
      args:
        - '--element'
        - role:Document
        - '--app'
        - input: app
        - '--timeout'
        - '20000'
  - id: ownership
    title: 核对任务进程归属
    run:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    outputs:
      hwnd:
        pointer: /hwnd
        type: number
      pid:
        pointer: /pid
        type: number
      start:
        pointer: /process_start
        type: string
  - id: insert
    title: 插入前缀并核对完整磁盘正文
    before:
      command: verify-file
      args:
        - '--path'
        - input: file
        - '--kind'
        - docx
        - '--expected'
        - '{"text":"ACTL seed"}'
        - '--subset'
    resume_check:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    run:
      sequence:
        - command: press
          args:
            - ctrl+home
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: type
          args:
            - role:Document
            - 'ACTL prefix '
            - '--paste'
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+s
            - '--target'
            - role:Document
            - '--app'
            - input: app
    verify:
      command: verify
      args:
        - '--value'
        - role:Document
        - ACTL prefix ACTL seed
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: uia-insert
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - ACTL prefix ACTL seed
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: replace
    title: 替换为多段正文并核验
    resume_check:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    run:
      sequence:
        - command: press
          args:
            - ctrl+a
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: type
          args:
            - role:Document
            - "ACTL report 2026\r\n第一段 中文 12345\r\nSecond paragraph 67890"
            - '--paste'
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+s
            - '--target'
            - role:Document
            - '--app'
            - input: app
    verify:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: uia-replace
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: append
    title: 追加正文并核验
    resume_check:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    run:
      sequence:
        - command: press
          args:
            - ctrl+end
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: type
          args:
            - role:Document
            - "\r\nAppend 中文 Ω 24680"
            - '--paste'
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+s
            - '--target'
            - role:Document
            - '--app'
            - input: app
    verify:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: uia-append
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: undo
    title: 撤销追加并核验
    resume_check:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    run:
      sequence:
        - command: press
          args:
            - ctrl+z
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+s
            - '--target'
            - role:Document
            - '--app'
            - input: app
    verify:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: uia-undo
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: redo
    title: 重做追加并核验
    resume_check:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    run:
      sequence:
        - command: press
          args:
            - ctrl+y
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+s
            - '--target'
            - role:Document
            - '--app'
            - input: app
    verify:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: uia-redo
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: bold
    title: 加粗并核验正文及 XML 格式
    resume_check:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    run:
      sequence:
        - command: press
          args:
            - ctrl+a
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+b
            - '--target'
            - role:Document
            - '--app'
            - input: app
        - command: press
          args:
            - ctrl+s
            - '--target'
            - role:Document
            - '--app'
            - input: app
    verify:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: uia-bold
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: close-before-reopen
    title: 核对原进程实例后关闭
    before:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
        - '--instance'
        - pending
        - '--hwnd'
        - '1'
        - '--pid'
        - '1'
      bind:
        7: ownership.start
        9: ownership.hwnd
        11: ownership.pid
    run:
      command: close-window
      args:
        - '--hwnd'
        - '1'
      bind:
        1: ownership.hwnd
    verify:
      command: verify-closed
      args:
        - '--hwnd'
        - '1'
        - '--pid'
        - '1'
        - '--instance'
        - pending
      bind:
        1: ownership.hwnd
        3: ownership.pid
        5: ownership.start
  - id: reopen
    title: 重开已保存的文档
    run:
      command: launch
      args:
        - input: program
        - /n
        - input: file
    verify:
      command: wait
      args:
        - '--element'
        - role:Document
        - '--app'
        - input: app
        - '--timeout'
        - '20000'
  - id: reopened-owner
    title: 核对重开文档的进程身份
    run:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
    outputs:
      hwnd:
        pointer: /hwnd
        type: number
      pid:
        pointer: /pid
        type: number
      start:
        pointer: /process_start
        type: string
  - id: reopened-content
    title: 重开后再次核对完整正文及格式
    run:
      command: verify-file
      args:
        - '--path'
        - input: file
        - '--kind'
        - docx
        - '--expected'
        - '{"text":"ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680","bold":true}'
  - id: uia-reopened-content
    title: 核对完整 UIA 正文
    run:
      command: verify
      args:
        - '--value'
        - role:Document
        - "ACTL report 2026\n第一段 中文 12345\nSecond paragraph 67890\nAppend 中文 Ω 24680"
        - '--property'
        - text
        - '--normalize-lines'
        - '--app'
        - input: app
  - id: close
    title: 关闭本任务文档并核对进程退出
    before:
      command: verify-owner
      args:
        - '--app'
        - input: app
        - '--program'
        - input: program
        - '--token'
        - input: file
        - '--instance'
        - pending
        - '--hwnd'
        - '1'
        - '--pid'
        - '1'
      bind:
        7: reopened-owner.start
        9: reopened-owner.hwnd
        11: reopened-owner.pid
    run:
      command: close-window
      args:
        - '--hwnd'
        - '1'
      bind:
        1: reopened-owner.hwnd
    verify:
      command: verify-closed
      args:
        - '--hwnd'
        - '1'
        - '--pid'
        - '1'
        - '--instance'
        - pending
      bind:
        1: reopened-owner.hwnd
        3: reopened-owner.pid
        5: reopened-owner.start
resources:
  directories: []
  files:
    - path: '${run.id}.docx'
      copy: assets/seed.docx
