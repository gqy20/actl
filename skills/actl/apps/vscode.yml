# 2026-09-29 静态维护：修改过的路线标为 manual，待新版真机复验；verified_date 保留历史日期。
# 来源: docs/24-application-adaptation-round1.md；docs/25-deep-edit-search-tests.md；docs/27-batch1-deep-tests.md。
pack_format: 1
name: vscode
display: Visual Studio Code
launch: "{installed_executable}"
window: "hwnd:{hwnd}"
app_version: "1.139.0"
verified_date: 2026-09-28
verified_env: Windows 10.0.26200.0 zh-cn; independent user-data-dir; extensions disabled; force-renderer-accessibility
quirks:
  - id: explicit_editor_readiness
    note: vscode-edit 首次打开与重开分别先等原生窗口、核对归属、确认前台，再等待具体文件的 Edit 内容稳定并核验完整 TextPattern。原 22 步扩展为 26 步，组合模板同步为 68 步；窗口标题出现不代表编辑器可输入，焦点仍由动作护栏逐次核验。实测见 docs/66。
  - id: quick_open_and_replace_readiness
    note: 文件切换直接 Ctrl+P，等待文件输入框后 ValuePattern 写入并读回，再在 quickInput_list 内激活唯一文件结果。查找/替换按容器 Window 精确名称限定两个 Edit 和按钮，等待输入框稳定、写值后精确核验；不按 Ctrl+H 后立即假定输入框可写。路线修订与恢复验收见 docs/66，旧 F1 路线记录保留。
  - id: workflow_live_20260929
    note: 新 workflow 首轮完成 17/22；关闭后首次核验 NOT_ACTIONABLE，恢复后通过；转到行输入在 type 阶段失败并停在待核对，未重放写入。不能视为整轮通过，见 docs/58。
  - id: workflow_migration_20260929
    note: 业务步骤及隔离资源声明均在 workflows；直接 flow-run --file 对应模板 --id 新任务ID，无需准备脚本或输入文件。独立文件及进程归属核验已接入；新资源入口真机待复验，历史证据保留，见 docs/60。
  - id: resumable_verification
    note: 2026-09-29，VS Code 1.139.1 的 scenarios/vscode-resume.ps1 持久化任务通过打开、单次输入与完整 TextPattern 读回；暂停后使用同一 flow ID 继续，不重跑准备脚本。此结论不覆盖磁盘保存和关闭，见 docs/55。workflows/vscode-resume.yml 现已承接桌面步骤和资源初始化，旧 PS 已删除；通用 verify-text.yml 本轮只读全文核验通过，新模板写入复验另见 docs/56。
  - id: empty_text_pattern
    note: 本机空编辑器 TextPattern 返回一个换行；不能据此推断非空文本也有附加换行。核验应先观察实际通道行为并精确比较完整结果，不使用包含匹配掩盖部分输入。
  - id: revalidation_20260929
    note: 2026-09-29：10 项编辑磁盘核验通过，但完整场景在关闭重开阶段中断；用户报告手动关闭。另用全新 profile 独立验证单次 close-window 后窗口与进程退出通过。命令面板等后半程未验收，见 docs/51。
  - id: current_execution_contract
    note: command_input、command、input、find、replace、editor 的 ref/snapshot_id 分别来自各自 find，禁止互用；set-value 后精确比对 value。编辑器 type 是插入，不用 --verify-value 将整篇内容误当插入片段；保存仍按磁盘全文验收。输入后控件变化则重新观察，不重放写入。
  - id: multiple_edit_surfaces
    note: 文件编辑器与 Chat Input 都是 Edit。必须按文件名加角色定位，再取唯一 ref，不能对裸 role:Edit 输入。
  - id: insertion_not_replacement
    note: type --paste 在当前选区或光标位置插入，不能假设覆盖全文。本轮在新打开临时文件的开头插入后保存，磁盘全文核验通过；会使用剪贴板。
  - id: edit_regression
    note: workflows/vscode-edit.yml 使用独立 profile 和临时文件，覆盖三轮中英文/符号输入、Ctrl+Z 撤销、Ctrl+Y 重做、Ctrl+A 全文替换和关闭重开。每次保存均核验磁盘全文，重开另验编辑器 TextPattern；不能用文件标题作为保存证据。
routes:
  - id: navigate_by_command
    description: F1 命令与行号/文件 Quick Input 使用 ValuePattern 写值，限定 quickInput_list 激活唯一结果
    status: manual
    verify: 组件探查已验证行号 2 定位和独立第二文件全文；22 步整轮另记。输入与候选焦点身份不同，不能用 type/Enter 放宽护栏，详见 docs/59。
    steps:
      - ["press", "f1", "--app", "{window}"]
      - ["set-value", "{command_input_selector}", "{command_query}", "--app", "{window}"]
      - ["wait", "--element", "{scoped_command_result}", "--app", "{window}"]
      - ["click", "{scoped_command_result}", "--app", "{window}"]
      - ["set-value", "{quick_input_selector}", "{line_or_owned_path}", "--app", "{window}"]
      - ["verify", "--value", "{quick_input_selector}", "{line_or_owned_path}", "--property", "value", "--app", "{window}"]
      - ["wait", "--element", "{scoped_result_selector}", "--app", "{window}"]
      - ["click", "{scoped_result_selector}", "--app", "{window}"]
  - id: replace_owned_text
    description: 仅在归属明确的测试文件中替换；Ctrl+F 后 Esc 未能可靠返回待替换选区，改用显式替换面板
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: 保存后磁盘全文精确等于预期；本轮验证数字替换。两个 ref 分别在各自写入前重新定位。
    steps:
      - ["press", "ctrl+h", "--app", "{window}"]
      - ["find", "--name", "查找", "--role", "Edit", "--app", "{window}"]
      - ["set-value", "{find_ref}", "{search}", "--app", "{window}", "--snapshot", "{find_snapshot_id}"]
      - ["get", "{find_ref}", "--property", "value", "--snapshot", "{find_snapshot_id}", "--app", "{window}"]
      - ["find", "--name", "替换", "--role", "Edit", "--app", "{window}"]
      - ["set-value", "{replace_ref}", "{replacement}", "--app", "{window}", "--snapshot", "{replace_snapshot_id}"]
      - ["get", "{replace_ref}", "--property", "value", "--snapshot", "{replace_snapshot_id}", "--app", "{window}"]
      - ["click", "name:全部替换 (Ctrl+Alt+Enter)", "--app", "{window}"]
      - ["click", "name:关闭 (Escape)", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
  - id: observe
    description: 读取独立测试窗口的控件结构
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: edit_owned_file
    description: 仅用于已确认归属的临时文本文件；将 find 的唯一 ref 填入 editor_ref，并确认插入位置
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: Ctrl+S 后从磁盘读取临时文件，与预期全文精确比较（仅规范化换行）；失败保留证据
    steps:
      - ["find", "--name", "{file_name}", "--role", "Edit", "--app", "{window}"]
      - ["get", "{editor_ref}", "--property", "text", "--app", "{window}", "--snapshot", "{editor_snapshot_id}"]
      - ["type", "{editor_ref}", "{text}", "--paste", "--app", "{window}", "--snapshot", "{editor_snapshot_id}"]
      - ["press", "ctrl+s", "--app", "{window}"]
