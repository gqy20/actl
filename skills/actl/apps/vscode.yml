# 2026-10-07：子树物化真机验证轮——Electron/Chromium provider 支持 Subtree 缓存物化(两模式 snapshot 输出逐字节一致),物化 ~1.4-1.5x(372 节点交错 A/B 中位);ACTL_WALK_LEGACY=1 为逐节点对照/回落。空 profile+资源管理器树约 372 节点,automation id 集中在 workbench.parts.*/status.*(与 within:id 路线吻合)。
# 2026-09-29：新版 vscode-edit workflow 26/26 通过；未按原样执行的通用路线仍为 manual，verified_date 保留档案历史日期。
# 来源: docs/24-application-adaptation-round1.md；docs/25-deep-edit-search-tests.md；docs/27-batch1-deep-tests.md。
pack_format: 1
name: vscode
display: Visual Studio Code
launch: "{installed_executable}"
window: "hwnd:{hwnd}"
app_version: "1.139.0"
verified_date: 2026-09-28
verified_env: Windows 10.0.26200.0 zh-cn; independent user-data-dir; extensions disabled; force-renderer-accessibility
quirks:
  - id: semantic_actions_20260929
    note: 新隔离英文 profile 的 vscode-edit workflow 已通过 26/26，含跳转行、数字替换、两次文件切换、精确正文与正常关闭核验，见 docs/67。布局移动不应拒绝 UIA 语义动作；动作仍校验组件和原生宿主身份、enabled 并重新获取 Pattern。wait --stable 只比较内容，Invoke 后仍等业务结果。此验收不替代以下通用 ref 路线逐条实测。
  - id: explicit_locale
    note: 独立 profile 默认语言可能为英文。vscode-edit 首次打开和重开均传 --locale en，并在正文写入前核验 File 菜单就绪，固定使用内置英文控件；不能用旧中文窗口推定新 profile 的语言。
  - id: navigation_without_shortcuts
    note: 跳转行点击 status.editor.selection 内部 Button，不能点击外层 Group 后假定生效；输入框和结果项等待稳定，Invoke 后等待状态栏目标行列出现，再精确核验。打开文件使用“打开快速访问”按钮；保存/撤消/恢复/替换使用菜单。菜单标签中的快捷键只是名称，不注入对应按键。组件连续四轮通过，完整流程结果见 docs/67。
  - id: explicit_editor_readiness
    note: vscode-edit 首次打开与重开分别先等原生窗口、核对归属、确认前台，再等待具体文件的 Edit 内容稳定并核验完整 TextPattern。原 22 步扩展为 26 步，组合模板同步为 68 步；窗口标题出现不代表编辑器可输入，焦点仍由动作护栏逐次核验。实测见 docs/66。
  - id: quick_open_and_replace_readiness
    note: 文件切换通过“打开快速访问”按钮，等待文件输入框稳定后 ValuePattern 写入并读回，再在 quickInput_list 内激活唯一文件结果。查找/替换按容器 Window 精确名称限定两个 Edit 和按钮，等待输入框稳定、写值后精确核验。历史路线修订与恢复验收见 docs/66，本轮见 docs/67。
  - id: workflow_live_20260929
    note: 新 workflow 首轮完成 17/22；关闭后首次核验 NOT_ACTIONABLE，恢复后通过；转到行输入在 type 阶段失败并停在待核对，未重放写入。不能视为整轮通过，见 docs/58。
  - id: workflow_migration_20260929
    note: 业务步骤及隔离资源声明均在 workflows；直接 flow-run --file 对应模板 --id 新任务ID，无需准备脚本或输入文件。独立文件及进程归属核验已接入；新资源入口真机待复验，历史证据保留，见 docs/60。
  - id: resumable_verification
    note: 2026-09-29，VS Code 1.139.1 的 scenarios/vscode-resume.ps1 持久化任务通过打开、单次输入与完整 TextPattern 读回；暂停后使用同一 flow ID 继续，不重跑准备脚本。此结论不覆盖磁盘保存和关闭，见 docs/55。workflows/vscode-resume.yml 现已承接桌面步骤和资源初始化，旧 PS 已删除；通用 verify-text.yml 本轮只读全文核验通过，新模板写入复验另见 docs/56。
  - id: empty_text_pattern
    note: 本机空编辑器 TextPattern 返回一个换行；不能据此推断非空文本也有附加换行。核验应先观察实际通道行为并精确比较完整结果，不使用包含匹配掩盖部分输入。
  - id: revalidation_20260929
    note: 2026-09-29：10 项编辑磁盘核验通过，但完整场景在关闭重开阶段中断；用户报告手动关闭。另用全新 profile 独立验证单次 close-window 后窗口与进程退出通过。命令面板等后半程未验收，见 docs/51。
  - id: current_execution_contract
    note: command_input、command、input、find、replace、editor 的 ref/snapshot_id 分别来自各自 find，禁止互用；set-value 后精确比对 value。编辑器 type 是插入，不用 --verify-value 将整篇内容误当插入片段；保存仍按磁盘全文验收。输入后控件变化则重新观察，不重放写入。
  - id: multiple_edit_surfaces
    note: 文件编辑器与 Chat Input 都是 Edit。必须按文件名加角色定位，再取唯一 ref，不能对裸 role:Edit 输入。
  - id: insertion_not_replacement
    note: type --paste 在当前选区或光标位置插入，不能假设覆盖全文。本轮在新打开临时文件的开头插入后保存，磁盘全文核验通过；会使用剪贴板。
  - id: edit_regression
    note: workflows/vscode-edit.yml 使用独立 profile 和临时文件，覆盖三轮中英文/符号输入、菜单撤销和重做、Ctrl+A 全文替换和关闭重开。每次保存均核验磁盘全文，重开另验编辑器 TextPattern；不能用文件标题作为保存证据。
  - id: v1141_extensions_disabled_notification
    note: >-
      VS Code 1.141 隔离 profile + --disable-extensions 启动时弹 INFO 通知
      "All installed extensions are temporarily disabled."（1.139 时代无此
      通知，2026-10-11 模板轮实证）。分类 unknown → 弹层门禁如实拦截
      popup_pending；模板无 popup_handlers 可声明（词表只收 error/save/
      confirm/update）。当前处置：人工判读后点 "Clear Notification (Del)"
      清理自产痕迹（通知本身是 --disable-extensions 触发的良性表面）。
      长期解：popup_handlers 词表裁（ROADMAP 在案）。
  - id: find_widget_uia_stale_surface
    note: >-
      Find/Replace 面板的可达性面对 Electron UIA 呈滞后/禁用态：Close
      按钮报 target_disabled（enabled:false），set-value 对 Find 输入框
      同拒；点 Close 后面板仍出现在 front-report（UIA 滞留），但键通道
      可用——ctrl+f（聚焦 find 输入框）后 esc 关闭，面板 UIA 文本随状态
      变化（"No results"→"1 of 1"）说明表面活着但语义通道半瘫。
      vscode-edit.yml find-replace 步已在 Close 后加 wait --gone 断言
      （2026-10-11）：面板 UIA 滞留则该步诚实失败，不再毒化下一步门禁。
  - id: keyboard_escape_channel
    note: >-
      press 的键名是 esc 不是 escape（PROTOCOL 会给别名提示）；全局键盘
      通道（press esc --app，不带 --target）走系统焦点不校验元素，VS Code
      编辑器聚焦时 esc 关 find 面板可靠；带 --target 的 press 严格断言
      焦点元素——焦点在编辑器时对 find 输入框的定向 press 会被如实拒绝
      （expected/current 证据），先用点击/键盘建立焦点再用。
routes:
  - id: navigate_by_controls
    description: 状态栏内部按钮打开行号框；快速访问按钮打开文件框；ValuePattern 写值并激活容器内唯一结果
    status: manual
    verify: 行号 1、2、1、2 连续组件验证通过；完整业务验收见 docs/67。Invoke 后须等待目标行列，不立即将旧状态判为失败。
    steps:
      - ["click", "uia:{\"match\":{\"role\":\"Button\"},\"within\":{\"id\":\"status.editor.selection\"}}", "--app", "{window}"]
      - ["wait", "--element", "{quick_input_selector}", "--stable", "--app", "{window}"]
      - ["set-value", "{quick_input_selector}", "{line}", "--app", "{window}"]
      - ["verify", "--value", "{quick_input_selector}", "{line}", "--property", "value", "--app", "{window}"]
      - ["wait", "--element", "{scoped_result_selector}", "--stable", "--app", "{window}"]
      - ["click", "{scoped_result_selector}", "--app", "{window}"]
      - ["wait", "--element", "{expected_caret_selector}", "--stable", "--app", "{window}"]
  - id: replace_owned_text
    description: 仅在归属明确的测试文件中替换；Ctrl+F 后 Esc 未能可靠返回待替换选区，改用显式替换面板
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: 保存后磁盘全文精确等于预期；本轮验证数字替换。两个 ref 分别在各自写入前重新定位。
    steps:
      - ["click", 'uia:{"match":{"role":"MenuItem","name":"Edit"}}', "--app", "{window}"]
      - ["wait", "--element", 'uia:{"match":{"role":"MenuItem","name":"Replace Ctrl+H"}}', "--app", "{window}"]
      - ["click", 'uia:{"match":{"role":"MenuItem","name":"Replace Ctrl+H"}}', "--app", "{window}"]
      - ["find", "--name", "Find", "--role", "Edit", "--app", "{window}"]
      - ["set-value", "{find_ref}", "{search}", "--app", "{window}", "--snapshot", "{find_snapshot_id}"]
      - ["get", "{find_ref}", "--property", "value", "--snapshot", "{find_snapshot_id}", "--app", "{window}"]
      - ["find", "--name", "Replace", "--role", "Edit", "--app", "{window}"]
      - ["set-value", "{replace_ref}", "{replacement}", "--app", "{window}", "--snapshot", "{replace_snapshot_id}"]
      - ["get", "{replace_ref}", "--property", "value", "--snapshot", "{replace_snapshot_id}", "--app", "{window}"]
      - ["click", "name:Replace All (Ctrl+Alt+Enter)", "--app", "{window}"]
      - ["click", "name:Close (Escape)", "--app", "{window}"]
      - ["click", 'uia:{"match":{"role":"MenuItem","name":"File"}}', "--app", "{window}"]
      - ["wait", "--element", 'uia:{"match":{"role":"MenuItem","name":"Save Ctrl+S"}}', "--app", "{window}"]
      - ["click", 'uia:{"match":{"role":"MenuItem","name":"Save Ctrl+S"}}', "--app", "{window}"]
  - id: observe
    description: 读取独立测试窗口的控件结构
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: edit_owned_file
    description: 仅用于已确认归属的临时文本文件；将 find 的唯一 ref 填入 editor_ref，并确认插入位置
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: 菜单保存后从磁盘读取临时文件，与预期全文精确比较（仅规范化换行）；失败保留证据
    steps:
      - ["find", "--name", "{file_name}", "--role", "Edit", "--app", "{window}"]
      - ["get", "{editor_ref}", "--property", "text", "--app", "{window}", "--snapshot", "{editor_snapshot_id}"]
      - ["type", "{editor_ref}", "{text}", "--paste", "--app", "{window}", "--snapshot", "{editor_snapshot_id}"]
      - ["click", 'uia:{"match":{"role":"MenuItem","name":"File"}}', "--app", "{window}"]
      - ["wait", "--element", 'uia:{"match":{"role":"MenuItem","name":"Save Ctrl+S"}}', "--app", "{window}"]
      - ["click", 'uia:{"match":{"role":"MenuItem","name":"Save Ctrl+S"}}', "--app", "{window}"]
