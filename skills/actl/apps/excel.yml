pack_format: 1
name: excel
display: Excel
launch: EXCEL            # App Paths 注册表解析,无需完整路径
window: "Excel"          # 标题子串;打开文件后为 "<文件名> - Excel"
app_version: "16.0.20326.20158"
verified_date: 2026-09-28
verified_env: "Win11 25H2 (build 26200) zh-CN；真实 Office 用户配置；独立合成 XLSX"
quirks:
  - id: teardown_patience
    note: 关工作簿后窗口消失需 3-15 秒（负载/加载项相关）,close 核验必须带耐心——workflow 用 wait --gone id:1001（60 秒）+ 引擎 verify-window settle；单发判定必撞假阴性。重开等就绪同理（冷启动 UIA 观察可抖 INTERNAL，已纳入观察恢复可重试集合）。
  - id: xlmain_shell_persists
    note: 壳的成因分层——close-window（WM_CLOSE）只收起窗口、进程必驻留;后台「文件→关闭」路线（click 文件 → NavBarMenu 内 ListItem「关闭」）是正确的文档关闭,干净条件下进程 ~5 秒退出,但 VSTO 运行时+输入法类加载项被激活后会钉住进程不退。因此 close 断言保持「工作簿窗口消失」（wait --gone id:1001）,进程退出不是本机可靠后置条件、不进任务断言;壳归环境治理,不 taskkill。
  - id: workflow_migration
    note: 业务步骤及隔离资源声明均在 workflows；直接 flow-run --file 对应模板 --id 新任务ID，无需准备脚本或输入文件。独立文件及进程归属核验已接入。
  - id: current_execution_contract
    note: 名称框 id:1001 输入前确认名称框唯一且已选择旧地址；Enter 只在名称框聚焦时执行。跳转后现场观察并核对目标单元格/编辑面，cell_input_selector 是其唯一语义选择器（不是 ref），须确认实际键盘焦点。粘贴与单元格提交使用该目标；焦点不同则停止，不退回仅按窗口放行。
  - id: protected_view
    note: 不可信位置(TEMP/下载)文件以受保护视图打开——UIA 读写正常但编辑被静默拒绝
    unblock: ["click", "name:启用编辑", "--app", "{window}"]
  - id: formula_bar
    note: 键盘直写编辑栏会被护栏拒(SetFocus 后物理前台标题瞬时为空);走剪贴板路线
  - id: cell_names
    note: 单元格 UIA name 是坐标("A2")非内容;内容检索用 extract 后本地过滤
  - id: save_read_lock
    note: ctrl+s 返回不代表保存结束；文件可能短暂被独占或替换，读回需允许共享读写并有界等待，不重复保存动作
  - id: hidden_empty_host
    note: 关闭工作簿后可能保留不可见的 Excel 空宿主；只有文件释放且控件树无工作簿内容时才记录文档关闭，不宣称进程退出
  - id: new_blank_book_provider_wedge_probe
    note: 2026-10-12 探针(与 2026-09-28 verified 路线记录矛盾,待复验):起始页树健康(56 元素稳定),但**新建空白工作簿**后主窗 UIA 观察连续撞 20s 看门狗、单点定位 12.7s 失败,等 45s 不恢复——「打开既有 XLSX」路线(table_extract/undo_redo verified 时所走)是否同楔死待复验;若打开路径健康,「新建空白簿」场景以打开模板/种子文件替代。新建首个工作簿弹的 owner 欢迎面板(WindowsForms10 无标题)UIA 读不到(0x80010121)但数秒自退,勿阻塞。
routes:
  - id: cell_write        # 变量 {cell} {value} {window} 由调用方替换
    description: 写入单元格(剪贴板直灌 + 名称框导航 + paste)
    status: manual
    steps:
      - ["set-clipboard", "{value}"]
      - ["type", "id:1001", "{cell}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["press", "ctrl+v", "--target", "{cell_input_selector}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "{cell_input_selector}"]
  - id: cell_read
    description: 读单元格(名称框往返 + ctrl+c + 剪贴板读回)
    status: manual
    steps:
      - ["type", "id:1001", "{cell}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["press", "ctrl+c", "--app", "{window}"]
      - ["get-clipboard"]
  - id: table_extract
    description: 表格抠数(GridPattern 直读;须先有数据物化,空簿无网格)
    status: verified
    steps:
      - ["extract", "role:DataGrid", "--app", "{window}"]
  - id: tsv_formulas
    description: 名称框选择起点，批量粘贴 TSV（含中文、数字与公式），保存并核验 XLSX
    status: manual
    steps:
      - ["type", "id:1001", "{cell}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["set-clipboard", "{tsv}"]
      - ["press", "ctrl+v", "--target", "{cell_input_selector}", "--app", "{window}"]
      - ["press", "esc", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
    verify: 解包 XLSX 核对各单元格值、f 公式及 v 计算结果；不以名称框或窗口标题证明写入成功
  - id: range_copy
    description: 按区域复制数据（Tab 分列、CRLF 分行），读取剪贴板并退出复制状态
    status: manual
    steps:
      - ["type", "id:1001", "{range}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["press", "ctrl+c", "--app", "{window}"]
      - ["get-clipboard"]
      - ["press", "esc", "--app", "{window}"]
    verify: 比较整块 TSV，包含空单元格
  - id: undo_redo_recalculate
    description: 修改数值后撤销/重做，每次保存核对原始值与依赖公式结果
    status: verified
    steps:
      - ["press", "ctrl+z", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
      - ["press", "ctrl+y", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
    verify: 每次保存后分别读取 XLSX 核对原始值与依赖公式结果
verify: workflows/excel-table.yml 使用独立 XLSX，按 HWND 绑定；公式和值通过磁盘 XML 核验，重开后通过区域复制读回；不调用 COM 写入业务数据
