# 2026-09-29 静态维护：修改过的路线标为 manual，待新版真机复验；verified_date 保留历史日期。
# actl 应用档案 pack(pack_format: 1)—— agent 消费的数据(核心 CLI 保持原子,不读此文件)
# 路线知识来源:docs/14 与 docs/29-office-deep-tests.md；后者附可重复场景脚本
pack_format: 1
name: excel
display: Excel
launch: EXCEL            # App Paths 注册表解析,无需完整路径
window: "Excel"          # 标题子串;打开文件后为 "<文件名> - Excel"
app_version: "16.0.20326.20158"
verified_date: 2026-09-28
verified_env: "Windows 10.0.26200.0 zh-CN；真实 Office 用户配置；独立合成 XLSX"
quirks:
  - id: teardown_patience
    note: 2026-09-30 实测（docs/68）：关工作簿后窗口消失需 3-15 秒（负载/加载项相关，孤立路径 2.8-4.2 秒），close 核验必须带耐心——workflow 用 wait --gone id:1001（60 秒）+ 引擎 verify-window settle；单发判定必撞假阴性。重开等就绪同理（冷启动 UIA 观察可抖 INTERNAL，已纳入观察恢复可重试集合）。
  - id: xlmain_shell_persists
    note: 2026-09-29 实证（docs/68 第二轮）：close-window --hwnd 关掉最后一个工作簿窗口后，原 HWND 存活为隐藏 XLMAIN 空壳（标题变"Excel"，Office 后台常驻/加载项持有），WM_CLOSE 不退出、不锁 xlsx、不影响 /x 新实例。verify-closed 的进程消失断言对 Excel 永远失败；workflow 关闭断言改用 verify-window --state absent（工作簿窗口消失）。真机清理时对隐藏壳 close-window --hwnd 可送达但进程不退，如实记录，不 taskkill。
  - id: workflow_migration_20260929
    note: 业务步骤及隔离资源声明均在 workflows；直接 flow-run --file 对应模板 --id 新任务ID，无需准备脚本或输入文件。独立文件及进程归属核验已接入；新资源入口真机待复验，历史证据保留，见 docs/60。
  - id: revalidation_20260929
    note: 2026-09-29 独立 XLSX 通过 TSV、公式表达式、重算、撤销、重做与区域复制 6 项核验；按起始单元格名称唯一定位并断言焦点成功。关闭阶段 snapshot 遇到窗口消失，最终关闭已确认，重开尚未验收；不将整轮记为通过，见 docs/51。
  - id: current_execution_contract
    note: 名称框 id:1001 输入前确认名称框唯一且已选择旧地址；Enter 只在名称框聚焦时执行。跳转后现场观察并核对目标单元格/编辑面，cell_input_selector 是其唯一语义选择器（不是 ref），须确认实际键盘焦点。粘贴与单元格提交使用该目标；焦点不同则停止，不退回仅按窗口放行。
  - id: protected_view
    note: 不可信位置(TEMP/下载)文件以受保护视图打开——UIA 读写正常但编辑被静默拒绝
    unblock: ["click", "name:启用编辑", "--app", "{window}"]
  - id: formula_bar
    note: 键盘直写编辑栏会被护栏拒(SetFocus 后物理前台标题瞬时为空);走剪贴板路线
  - id: cell_names
    note: 单元格 UIA name 是坐标("A2")非内容;内容检索用 extract 后本地过滤
  - id: save_read_lock
    note: ctrl+s 返回不代表保存结束；文件可能短暂被独占或替换，读回需允许共享读写并有界等待，不重复保存动作
  - id: hidden_empty_host
    note: 关闭工作簿后可能保留不可见的 Excel 空宿主；只有文件释放且控件树无工作簿内容时才记录文档关闭，不宣称进程退出
routes:
  - id: cell_write        # 变量 {cell} {value} {window} 由调用方替换
    description: 写入单元格(剪贴板直灌 + 名称框导航 + paste)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["set-clipboard", "{value}"]
      - ["type", "id:1001", "{cell}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["press", "ctrl+v", "--target", "{cell_input_selector}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "{cell_input_selector}"]
  - id: cell_read
    description: 读单元格(名称框往返 + ctrl+c + 剪贴板读回)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["type", "id:1001", "{cell}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["press", "ctrl+c", "--app", "{window}"]
      - ["get-clipboard"]
  - id: table_extract
    description: 表格抠数(GridPattern 直读;须先有数据物化,空簿无网格)
    status: verified
    steps:
      - ["extract", "role:DataGrid", "--app", "{window}"]
  - id: tsv_formulas
    description: 名称框选择起点，批量粘贴 TSV（含中文、数字与公式），保存并核验 XLSX
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["type", "id:1001", "{cell}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["set-clipboard", "{tsv}"]
      - ["press", "ctrl+v", "--target", "{cell_input_selector}", "--app", "{window}"]
      - ["press", "esc", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
    verify: 解包 XLSX 核对各单元格值、f 公式及 v 计算结果；不以名称框或窗口标题证明写入成功
  - id: range_copy
    description: 按区域复制数据（Tab 分列、CRLF 分行），读取剪贴板并退出复制状态
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["type", "id:1001", "{range}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}", "--target", "id:1001"]
      - ["press", "ctrl+c", "--app", "{window}"]
      - ["get-clipboard"]
      - ["press", "esc", "--app", "{window}"]
    verify: 比较整块 TSV，包含空单元格；场景脚本另验证重开后 D4 等于 71
  - id: undo_redo_recalculate
    description: 修改数值后撤销/重做，每次保存核对原始值与依赖公式结果
    status: verified
    steps:
      - ["press", "ctrl+z", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
      - ["press", "ctrl+y", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
    verify: 每次保存后分别读取 XLSX；本轮 B2 为 2/4 时，D2 为 25/50、D4 为 46/71
verify: workflows/excel-table.yml 使用独立 XLSX，按 HWND 绑定；公式和值通过磁盘 XML 核验，重开后通过区域复制读回；不调用 COM 写入业务数据
