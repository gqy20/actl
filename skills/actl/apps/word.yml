pack_format: 1
name: word
display: Word
launch: WINWORD           # App Paths 注册表解析,无需完整路径
window: "Word"            # 标题子串;打开文件后为 "<文件名> - Word"(兼容模式文档多一段 " - 兼容性模式")
app_version: "16.0.20430.20092"
verified_date: 2026-10-04
verified_env: "Win11 25H2 (build 26200) zh-CN；真实 Office 用户配置；独立测试文档"
quirks:
  - id: dual_window_layers
    note: Word 为双层窗口——外层 OpusApp 框架 + 内层 _WwG 文档宿主（标题飘忽，常见"Microsoft Word 文档"）。内层可持前台致 type 前台守卫拒（evidence.actual="Microsoft Word 文档"），框架层被模态禁用时 focus-window 报 window not ready；_WwG 的 UIA 树干净（Document→页面→Body Edit, id:Body 可寻址）而 OpusApp 层快照/查找系统性 INTERNAL("no usable runtime identity")。保存确认/错误框可能不出现在 list-windows 枚举（弹层判读失明，只能截图判读兜底）；close-window 的 WM_CLOSE 返回 ok 但模态未清时窗口不关。见 docs/81。
  - id: keyboard_line_selection_unreliable
    note: ctrl+home+shift+end 等键盘行选区在本机 Word 从未真正建立——按键全 ok、焦点三视图干净，但 ctrl+c 后剪贴板为空（对照：ctrl+a 全选+复制成功）。行级选择改用鼠标行首左侧选定区物理点击（click xy --physical，坐标由截图+视觉判读提取）；或样式路线的光标式应用（见 style_choreography 路线）根本不需要选区。
  - id: autoformat_numbered_paste
    note: 粘贴"N. 文本"到上一编号条目后的新段会触发 Word 自动编号列表——显示成"N. N. 文本"（自动编号+粘贴文本自带编号叠加）；流程文本改用 ①②③④/• 等非 ASCII 数字编号规避。
  - id: n_drive_startup_dialog
    note: 本机 Word 每次开文档弹「目录名无效。(N:\)」错误框（某项配置指向未连接的 N: 盘）；错误框 OK 按钮 automation_id=2，popup_handlers 声明(app 锚为步骤 --app 子串/classification error/name_contains 目录名无效/click id:2)可由引擎弹层治理处置。
  - id: a11y_cache_malformed_regression
    note: **疑 Office 更新回归(2026-10-12 定性)**:16.0.20430 起 Malformed Cacheresponse pTreeStructure 跨文档类全量触发(原生模板/外部最小 OOXML/新空白文档三证;body_read 2026-10-04 verified 于 16.0.20326)。后果三件:①Document text 通道空——body_read 路线当前失效(已降 manual);②物化被拒答→自动回落逐节点遍历(设计兜底,诚实不挂;143 页 walk 6.9s);③树结构=chrome+「页面 N」(Custom,id=UIA_AutomationId_Word_Page_N)+「页面 N 内容」(Edit,**所有页共享 id=Body**——id:Body 返回全页匹配,寻址用 name:页面 N 内容 或序数)。树随页数缩放不随段数:4000 段文档全量快照 481 元素(143 页×2+chrome),段落从不作为元素出现,逐段寻址不存在;双模式身份一致性保持(skeleton⊆full)。复验条件=Office 修复版本;复验内容=body_read 恢复+回落消失。
  - id: start_screen_overrides_n_switch
    note: 本机 Word「启动时显示开始屏幕」选项优先于命令行 /n——裸 `WINWORD /n` 停在开始屏幕（窗口标题裸 "Word"，深色主题下界面整体深灰易误判为许可/激活问题；UIA 无 Document、按钮全禁用），写步必然 NOT_FOUND；文档只有用户在开始屏幕交互后才物化。对策=launch /n 带文件参数结构性绕过（resources 复制种子 docx），并把关卡在 wait --element role:Document 物化门而非仅窗口存在。
  - id: owned_dialog_anchor_for_input
    note: owned 32770 类模态对话框（F12 另存为）是独立标题的顶层前台窗口——type/press 的前台守卫以步骤锚定的顶层窗口为 expected，锚 Word 主窗时 expected(主窗标题)/actual(对话框标题)永不匹配（NOT_ACTIONABLE 死路）；对话框内的输入/按键必须 `--app` 对话框自身标题（如 另存为），弹层门禁同步需要该锚的 popup_ignores 认领。另：另存为对话框默认目录=被打开文档所在目录，非 Word 默认文档目录；对话框含 20+ 个 Edit（元数据/搜索等），文件名框须用 uia 严格复合形态（role:Edit+name:文件名:）。
# 常驻面板声明(降噪第二轮 pack 来源):flow 引擎解析计划时自动
# 并入 popup_ignores(与模板级声明并集去重)——Word 家族锚形态两种
# (标题 <文件名> - Word 含 Word;文件名锚 .docx),各声明一条。
popup_ignores:
  - app: "Word"
    name_contains: "导航"
  - app: ".docx"
    name_contains: "导航"
  - app: "Word"
    name_contains: "搜索"
  - app: ".docx"
    name_contains: "搜索"
routes:
  - id: body_read
    description: 正文读取(TextPattern 文档通道;中英文皆逐字)
    status: manual
    verify: 16.0.20430 疑更新回归期 Document text 返回空(a11y_cache_malformed_regression);恢复后按实际结果复验转 verified
    steps:
      - ["get", "role:Document", "--app", "{window}", "--property", "text"]
  - id: style_choreography
    description: 样式排版流程(模板预置样式空段+逐段填充;零运行时样式操作)
    status: verified
    steps:
      - ["launch", "{program}", "/n", "{file}"]
      - ["wait", "--element", "role:Document", "--app", "{window}", "--timeout", "30000"]
      - ["type", "role:Document", " ", "--paste", "--app", "{window}"]
      - ["press", "ctrl+z", "--target", "role:Document", "--app", "{window}"]
      - ["type", "role:Document", "{段落文本}", "--paste", "--app", "{window}"]
      - ["press", "down", "--target", "role:Document", "--app", "{window}"]
      - ["press", "ctrl+s", "--target", "role:Document", "--app", "{window}"]
    verify: 模板 note-template.docx 预置 12 个带样式空段(P1=标题1/P3、P8=标题2,黑体20/雅黑14/宋体12+1.5倍行距);流程只填文本(type --paste 单调用内化剪贴板)不碰样式;尾部 \r 或 \r\n 粘贴不建段(只产生软换行),分隔符内嵌才建段;填充式靠组级全文断言 fail-safe;关闭重开后 verify-file --kind docx-styles 逐段断言(workflows/word-note-typography.yml 12 步真机两轮通过)
  - id: body_append
    description: 正文写入(paste 通道;追加落在焦点处,先 click 定位插入点)
    status: manual
    steps:
      - ["click", "role:Document", "--app", "{window}"]
      - ["type", "role:Document", "{text}", "--paste", "--app", "{window}"]
    verify: 写入后用 body_read 核对全文；兼容模式文档冷启动观察可抖 INTERNAL（观察恢复可重试集合），须等沉降
