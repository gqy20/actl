# actl 应用档案 pack(pack_format: 1)—— 路线知识来源:docs/14 与 docs/29-office-deep-tests.md
pack_format: 1
name: word
display: Word
launch: WINWORD          # App Paths 注册表解析
window: "Word"           # 打开文件后为 "<文件名> - Word"
app_version: "16.0.20326.20158"
verified_date: 2026-09-28
verified_env: "Windows 10.0.26200.0 zh-CN；独立合成 DOCX，兼容性模式"
quirks:
  - id: protected_view
    note: 不可信位置文件同样走受保护视图;解法同 Excel
    unblock: ["click", "name:启用编辑", "--app", "{window}"]
  - id: paragraph_readback
    note: TextPattern 用 CR 分段，DOCX 用 w:p；核验时统一换行，不能将段落拆分或丢失误认为无关空白
  - id: selection_focus
    note: Ctrl+A 依赖正文焦点；先 type role:Document 获取正文焦点并读回，不能在搜索框或功能区焦点下直接全选粘贴
routes:
  - id: body_read
    description: 正文读取(TextPattern 文档通道;中英文皆逐字)
    status: verified
    steps:
      - ["get", "role:Document", "--app", "{window}", "--property", "text"]
  - id: body_append
    description: 正文写入(paste 通道;追加落在焦点处,先 click 定位插入点)
    status: verified
    steps:
      - ["set-clipboard", "{text}"]
      - ["click", "{anchor}", "--app", "{window}"]
      - ["paste", "--app", "{window}"]
  - id: save_inplace
    description: 原地保存(ctrl+s 不弹窗)
    status: verified
    steps:
      - ["press", "ctrl+s", "--app", "{window}"]
  - id: replace_paragraphs
    description: 正文焦点已确认后，全选替换为多段文本
    status: verified
    steps:
      - ["press", "ctrl+a", "--app", "{window}"]
      - ["set-clipboard", "{text}"]
      - ["paste", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
      - ["get", "role:Document", "--property", "text", "--app", "{window}"]
    verify: TextPattern 与 word/document.xml 按段落拼接的全文均精确匹配；只对明确授权替换的文档使用
  - id: append_at_end
    description: 正文焦点已确认后 Ctrl+End 定位文末，再粘贴追加段落
    status: verified
    steps:
      - ["press", "ctrl+end", "--app", "{window}"]
      - ["set-clipboard", "{text}"]
      - ["paste", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
      - ["get", "role:Document", "--property", "text", "--app", "{window}"]
    verify: 原文完整且追加文本位于末尾；不是仅检查 contains
  - id: undo_redo_append
    description: 撤销/重做当前测试追加，每步保存并读回全文
    status: verified
    steps:
      - ["press", "ctrl+z", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
      - ["get", "role:Document", "--property", "text", "--app", "{window}"]
      - ["press", "ctrl+y", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
      - ["get", "role:Document", "--property", "text", "--app", "{window}"]
    verify: 撤销后等于原文，重做后等于原文加追加段落；两次都核对磁盘文件
  - id: bold_selection
    description: 正文全选后切换加粗；已验证从未加粗切换为加粗
    status: verified
    steps:
      - ["press", "ctrl+a", "--app", "{window}"]
      - ["press", "ctrl+b", "--app", "{window}"]
      - ["press", "ctrl+s", "--app", "{window}"]
    verify: 全文未变化且每个含文字的 w:r 带有效 w:b；Ctrl+B 是切换，不可无条件重复
verify: scenarios/word-edit.ps1 用独立 DOCX；每次操作按 TextPattern 和磁盘 XML 双重全文断言，保存重开后再次读回
