# 2026-10-05：收起方向识图复验通过——Table 树内残留系 Electron UIA 树滞留（推翻 2026-10-04 误判）；主窗 frameless 吞系统关闭语义（close-window 双语义无效），实测像素定位 + 物理点击自绘 X 可关。
# 2026-10-04：search/open_queue 路线真机复验通过（manual→verified，focused 输入通道）。
# 2026-09-29：关联 PS 已迁入 workflow；新模板协议预检通过，真实写入复验待完成。
# 2026-09-29 静态维护：修改过的路线标为 manual，待新版真机复验；verified_date 保留历史日期。
# 来源: docs/24；docs/27-batch1-deep-tests.md；搜索、播放切换与队列真机验证。
pack_format: 1
name: cloudmusic
display: 网易云音乐
launch: cloudmusic           # 冷启动窗口 ~30s 才现（process started 但 window_not_found 不是失败，等即可）；关闭主窗后托盘常驻（5 进程属设计，勿 taskkill）
window: "hwnd:{hwnd}"
app_version: "3.1.41.205529"
verified_date: 2026-10-05
verified_env: Windows 10.0.26200.0 zh-cn（2026-10-04 search/open_queue 复验：find 唯一 Edit → click 聚焦 → type focused: 单调用 → enter；2026-10-05 收起方向识图复验 + 关闭路径实测：像素定位 X + 物理点击 → 托盘隐藏）
quirks:
  - id: current_execution_contract
    note: search_ref/search_snapshot_id、queue_ref/queue_snapshot_id 分别来自紧邻的 find，先核对唯一 Edit 或 MenuItem。搜索提交前断言具体搜索框焦点；若输入导致身份变化，重新 find 后更新这对变量。读取未知或错误不能当作暂停、空查询或空队列。
  - id: sparse_tree_rich_text
    note: 初轮快照只有 6 个节点；本轮还原并观察后出现完整控件树、搜索 Edit 和播放 MenuItem。稀疏树时先检查窗口状态和重新观察，不能断言该版本永远不提供 UIA；树恢复的具体触发原因未确定。
  - id: search_placeholder_name
    note: 搜索 Edit 的 name 可能是变化的推荐词，不等于已输入查询。确认唯一 Edit 后输入，提交后核对查询标题和结果；不要以 name 读回查询词。
  - id: playback_control
    note: 底栏播放控件的稳定 ID 为 btn_pc_minibar_play，MenuItem 的 name 在 play/pause 间切换。name:play 会与推荐卡片按钮、图片重名。Ctrl+P 真机验证可切换；使用前核对目标窗口与播放状态。
  - id: playlist_ambiguity
    note: name:playlist 同时匹配 Image 和 MenuItem，find 时限制 role=MenuItem，再用当前 ref；打开后核对队列表格，不操作清空/删除按钮。
  - id: collapse_tree_lag
    note: 队列面板收起后 find --role Table 仍 total=1——Electron UIA 树滞留，不代表面板未收起（2026-10-05 识图证实：面板视觉已收起、入口按钮非激活）。收起/展开的状态核验用整窗截图，不用树内元素存在性。
  - id: programmatic_close_refused
    note: 主窗 frameless（WS_SYSMENU=False），标题栏按钮网页自绘、不入 UIA 树；进程外 WM_CLOSE/SC_CLOSE（close-window 双语义）与 UIA WindowPattern.Close 全部无效，但 UI 线程健在（WM_NULL 即应、SC_MINIMIZE 正常）——是应用吞关闭语义，非挂起非模态。可行关闭路径：screenshot --hwnd 截窗 → 标题栏右上像素簇分析取最右按钮中心（实测窗口 [864,328,2977,1832] 时关闭 X 在 (2878,400)；视觉模型读坐标偏差 ~25px，以像素簇为准）→ focus-window → click xy:<物理坐标> --physical；成功即隐藏到托盘=关闭达成（进程常驻属设计）。勿全树 find --name（本窗实测 126s）；坐标以 actl 物理口径为准——非 DPI 感知进程（PowerShell）的 GetWindowRect 返回 0.5× 逻辑坐标，勿混用。
routes:
  - id: observe
    description: 根据 list-windows 确认目标 HWND 后读取控件树
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: read_content
    description: 读取当前页面内容；先确认窗口内只有一个 Document
    status: verified
    verify: 文本非空，并与截图可见栏目对应；不把歌曲列表当作播放状态
    steps:
      - ["get", "role:Document", "--property", "text", "--app", "{window}"]
  - id: search
    description: 唯一 Edit 点击聚焦后 focused: 单调用输入并提交（2026-10-04 真机复验，中文 3 字符一次送达）
    status: verified
    verify: 结果页快照含查询词（输入框 name 是推荐词，不作内容断言）
    steps:
      - ["find", "--role", "Edit", "--app", "{window}"]
      - ["click", "{search_ref}", "--app", "{window}"]
      - ["type", "focused:", "{query}", "--app", "{window}"]
      - ["press", "enter", "--app", "{window}"]
      - ["snapshot", "--app", "{window}"]
  - id: toggle_playback
    description: Ctrl+P 切换播放状态；workflows/cloudmusic-playback.yml 交替比较键盘与 UIA，每轮恢复初始状态
    status: verified
    verify: get 的 name 必须从 play 变 pause 或反向变化；仅证明应用报告的播放状态，不证明扬声器输出。脚本本轮 8 次切换全部通过。
    steps:
      - ["get", "id:btn_pc_minibar_play", "--app", "{window}"]
      - ["press", "ctrl+p", "--app", "{window}"]
      - ["get", "id:btn_pc_minibar_play", "--app", "{window}"]
  - id: open_queue
    description: 限定 MenuItem 消除播放列表入口同名歧义（2026-10-04 展开方向真机复验；2026-10-05 收起方向识图证实）
    status: verified
    verify: 队列展开出现 Table（find --role Table total=1）；收起方向已实证——面板视觉收起、入口按钮非激活（截图核验），Table 树内残留系 UIA 树滞留，不作收起判据（见 collapse_tree_lag quirk）。
    steps:
      - ["find", "--name", "playlist", "--role", "MenuItem", "--app", "{window}"]
      - ["click", "{queue_ref}", "--app", "{window}"]
      - ["find", "--role", "Table", "--app", "{window}"]
      - ["snapshot", "--app", "{window}"]
