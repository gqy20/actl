# 2026-09-29 静态维护：修改过的路线标为 manual，待新版真机复验；verified_date 保留历史日期。
# 来源: docs/24；docs/27-batch1-deep-tests.md；搜索、播放切换与队列真机验证。
pack_format: 1
name: cloudmusic
display: 网易云音乐
launch: cloudmusic
window: "hwnd:{hwnd}"
app_version: "3.1.41.205529"
verified_date: 2026-09-28
verified_env: Windows 10.0.26200.0 zh-cn
quirks:
  - id: current_execution_contract
    note: search_ref/search_snapshot_id、queue_ref/queue_snapshot_id 分别来自紧邻的 find，先核对唯一 Edit 或 MenuItem。搜索提交前断言具体搜索框焦点；若输入导致身份变化，重新 find 后更新这对变量。读取未知或错误不能当作暂停、空查询或空队列。
  - id: sparse_tree_rich_text
    note: 初轮快照只有 6 个节点；本轮还原并观察后出现完整控件树、搜索 Edit 和播放 MenuItem。稀疏树时先检查窗口状态和重新观察，不能断言该版本永远不提供 UIA；树恢复的具体触发原因未确定。
  - id: search_placeholder_name
    note: 搜索 Edit 的 name 可能是变化的推荐词，不等于已输入查询。确认唯一 Edit 后输入，提交后核对查询标题和结果；不要以 name 读回查询词。
  - id: playback_control
    note: 底栏播放控件的稳定 ID 为 btn_pc_minibar_play，MenuItem 的 name 在 play/pause 间切换。name:play 会与推荐卡片按钮、图片重名。Ctrl+P 真机验证可切换；使用前核对目标窗口与播放状态。
  - id: playlist_ambiguity
    note: name:playlist 同时匹配 Image 和 MenuItem，find 时限制 role=MenuItem，再用当前 ref；打开后核对队列表格，不操作清空/删除按钮。
routes:
  - id: observe
    description: 根据 list-windows 确认目标 HWND 后读取控件树
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: read_content
    description: 读取当前页面内容；先确认窗口内只有一个 Document
    status: verified
    verify: 文本非空，并与截图可见栏目对应；不把歌曲列表当作播放状态
    steps:
      - ["get", "role:Document", "--property", "text", "--app", "{window}"]
  - id: search
    description: 确认唯一搜索 Edit 及空查询后，中文粘贴并提交；已有查询先在该框内全选
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: 结果页出现提交的查询标题及对应歌曲/歌手；输入框 name 仅作提示词，不作内容断言。
    steps:
      - ["find", "--role", "Edit", "--app", "{window}"]
      - ["type", "{search_ref}", "{query}", "--paste", "--app", "{window}", "--snapshot", "{search_snapshot_id}"]
      - ["press", "enter", "--app", "{window}", "--target", "{search_ref}", "--snapshot", "{search_snapshot_id}"]
      - ["snapshot", "--app", "{window}"]
  - id: toggle_playback
    description: Ctrl+P 切换播放状态；scenarios/cloudmusic-playback.ps1 交替比较键盘与 UIA，每轮恢复初始状态
    status: verified
    verify: get 的 name 必须从 play 变 pause 或反向变化；仅证明应用报告的播放状态，不证明扬声器输出。脚本本轮 8 次切换全部通过。
    steps:
      - ["get", "id:btn_pc_minibar_play", "--app", "{window}"]
      - ["press", "ctrl+p", "--app", "{window}"]
      - ["get", "id:btn_pc_minibar_play", "--app", "{window}"]
  - id: open_queue
    description: 限定 MenuItem 消除播放列表入口同名歧义
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: 队列展开出现 Table，截图和当前歌曲对应；再次点击入口可收起。
    steps:
      - ["find", "--name", "playlist", "--role", "MenuItem", "--app", "{window}"]
      - ["click", "{queue_ref}", "--app", "{window}", "--snapshot", "{queue_snapshot_id}"]
      - ["snapshot", "--app", "{window}"]
