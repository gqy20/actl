# 2026-09-29 静态维护：修改过的路线标为 manual，待新版真机复验；verified_date 保留历史日期。
# actl 应用档案 pack(pack_format: 1)—— 微信 4.x(Windows 桌面版,Qt/mmui 界面体系)
# 知识来源:wechat-ui-collector 项目(同作者)的 weixin-4x profile + 本机真机
# 验证(2026-09-27:会话物理点击切换 ✓ 消息区物化 ✓ 输入草稿闭环 ✓,未测发送)
pack_format: 1
name: wechat
display: 微信
launch: Weixin           # 进程名 Weixin/WeChat;窗口类 mmui::MainWindow
window: "微信"
app_version: "4.1.x"
verified_date: 2026-09-27
quirks:
  - id: current_execution_contract
    note: 发送前核对明确授权、会话身份和完整草稿；发送后核对新消息及发送状态，输入框清空不是成功凭据。所有 *_ref 为完整 @eN，与对应 *_snapshot_id 成对；moments 来自发现页快照。bubble_selector/target 为现场唯一语义选择器；不支持快照绑定的命令执行前重新观察。physical 点击仍须显式参数，失败先核验是否送达。
  - id: physical_click_required
    note: >-
      会话条目 UIA Invoke 返回 ok 但不触发导航(mmui/Qt 特性,实测)。范式(v2)——
      UIA 优先 + 物化验证 + 受控降级:先 click --expect element:id:chat_message_list
      (假成功会以 ASSERTION_FAILED 暴露,evidence.cause 区分"假成功"与"目标错误"),
      失败后先核对是否已切换会话及送达情况；只有确认未生效才评估显式 physical 路线(见 open_conversation_uia_first / open_conversation_physical)
  - id: materialize_on_open
    note: 消息区元素(chat_message_list/chat_input_field)仅在会话打开后物化;wait --element id:chat_message_list 是就绪判据
  - id: rich_session_ids
    note: 会话条目 automation_id 含名称(session_item_文件传输助手),且条目 name 为"名称\n置顶\n预览\n时间"复合文本
  - id: bubble_reading
    note: 消息气泡是 Custom role(非 ListItem/DataItem),extract 不命中——读消息用全量 snapshot 后按 name 解析(气泡 name = 正文全文,虚拟化只含可见窗口段)
  - id: virtualized_messages
    note: 消息列表 mmui::RecyclerListView 虚拟化,4.1.x 无 Scroll pattern——滚动用物理滚轮兜底
  - id: input_value_readback
    note: 输入框(id:chat_input_field)暴露 ValuePattern——paste 后 get --property value 读回逐字可用(实测);清草稿 = press ctrl+a + press delete(切勿回车,回车即发送)
  - id: moments_quirks
    note: >-
      朋友圈入口在发现页(快照后按 ref 精点,如 @e16);帖子 name=「作者 来源 正文 时间 类型·来源」复合文本;
      滚动须 ≥15 档滚轮(虚拟化懒加载阈值,5 档无效果);回聊天页用 --near name:通讯录 锚点消歧(微信 与窗口同名);
      导航图标无 clickable point——click --physical 已有 rect-center 兜底+命中检查
  - id: file_dialog_quirks
    note: >-
      微信"选择文件"是自绘 #32770:真"打开"按钮是 SplitButton(无 ref,点击 DropDown 箭头
      和回车都无效)——正解 alt+o 助记键;文件名框 = ComboBox(id:1148)的子 Edit;
      发送按钮与 发送表情/收藏/文件 同名前缀,find 后按 ref 精点;文件气泡 name 形态与
      文本不同(时间戳邻近,靠会话预览[文件]+时间戳双证);联系人详情页会令 通讯录 锚点
      重名,回聊天页换 name:发现 锚点
  - id: context_menu_invisible
    note: >-
      右键菜单是 mmui 自绘,UIA 树不可见(find MenuItem 空)——菜单操作走视觉兜底:
      right-click 后 screenshot --app → 多模态读菜单项坐标 → click xy:<x>,<y>
      --app 微信 --physical(窗口边界守卫;2026-09-27 坐标寻址已落地);
      自己消息的菜单无"引用"项(复制/转发/收藏/提醒/删除)
  - id: mention_object
    note: >-
      @人引用以 U+FFFC 内嵌对象插入,输入框 Value 读回显示为对象符非纯文本——
      含 @ 的草稿读回核对只对文本部分有效
  - id: file_bubble_name
    note: >-
      文件消息气泡的 name 不含文件名(时间戳邻近元素)——文件定位靠会话预览[文件]
      或发送侧记录;接收侧点击/另存为留开放项
  - id: safety_no_blind_send
    note: 真实聊天应用——发送前必须读回输入框 value 并核对会话标题;严禁盲发
  - id: background_ops
    note: >-
      两件套已产品化(2026-09-28)——wait --idle <ms>(输入空闲门，不证明人不在或已授权；查询失败为未知)+
      指针族 --no-activate(WS_EX_NOACTIVATE 后台点击,不抢前台,光标送回;
      键盘仍需前台)。采集/扫描类长任务 = wait --idle + --no-activate 点击;
      UI 驱动段与 wechat-ui-collector 并存时按 docs/09 §6.2 共享
      actl-input-lock 锁约定
routes:
  - id: session_scan
    description: 会话列表概览(只读安全;条目 name 含预览与时间)
    status: verified
    steps:
      - ["snapshot", "--app", "{window}", "--skeleton"]
  - id: open_conversation_uia_first
    description: 打开指定会话(UIA 优先；失败需诊断，不自动重放或降级)
    status: unverified
    verify: 消息区存在只能证明已物化，不能证明切换到指定会话；还须核对会话身份与内容。ASSERTION_FAILED 可能是后置观察失败，先检查 evidence 与送达情况。
    steps:
      - ["click", "id:session_item_{name}", "--app", "{window}", "--expect", "element:id:chat_message_list", "--timeout", "4000"]
  - id: open_conversation_physical
    description: 打开指定会话(受控物理降级:UIA 假成功实证路线;打开后消息区才物化)
    status: verified
    steps:
      - ["click", "id:session_item_{name}", "--app", "{window}", "--physical"]
      - ["wait", "--element", "id:chat_message_list", "--app", "{window}", "--timeout", "4000"]
  - id: read_messages
    description: 读当前会话消息(气泡=Custom role,走快照 name 解析,非 extract)
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: draft_message
    description: 输入框草稿 + 读回(不发送;发送前的人工核对材料)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["set-clipboard", "{text}"]
      - ["click", "id:chat_input_field", "--app", "{window}"]
      - ["press", "ctrl+v", "--target", "id:chat_input_field", "--app", "{window}"]
      - ["get", "id:chat_input_field", "--app", "{window}", "--property", "value"]
  - id: clear_draft
    description: 清空输入框草稿(ctrl+a + delete;绝不用回车——回车即发送)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["press", "ctrl+a", "--app", "{window}", "--target", "id:chat_input_field"]
      - ["press", "delete", "--app", "{window}", "--target", "id:chat_input_field"]
  - id: send_message
    description: 发送(高危:仅在 draft_message 读回核对后执行;本路线未做真机验证)
    status: unverified
    verify: 输入框 value 读回比对(draft_message 最后一步);发送后新气泡出现在下一次快照
    steps:
      - ["click", "name:发送", "--app", "{window}", "--physical"]
  - id: moments
    description: 刷朋友圈(发现页中转;读取=快照 name 解析;滚动=物理滚轮,虚拟化懒加载需大步长)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["click", "name:发现", "--app", "{window}", "--physical"]
      - ["snapshot", "--app", "{window}"]
      - ["click", "{moments_ref}", "--app", "{window}", "--physical", "--snapshot", "{moments_snapshot_id}"]
      - ["wait", "--element", "id:sns_list", "--app", "{window}", "--timeout", "3000"]
      - ["snapshot", "--app", "{window}"]
      - ["scroll", "id:sns_list", "--down", "15", "--app", "{window}"]
      - ["snapshot", "--app", "{window}"]
  - id: moments_back
    description: 朋友圈回聊天页(name:微信 与窗口同名,--near 通讯录 锚点消歧)
    status: verified
    steps:
      - ["click", "name:微信", "--app", "{window}", "--near", "name:通讯录", "--physical"]
      - ["find", "--id", "session_list", "--app", "{window}"]
  - id: send_verified
    description: 发送前读回核对，再按绑定 ref 精点发送按钮并核验新消息；修订路线待复验
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: 发送前完整草稿与授权文本一致，确认目标会话；发送后核对该会话新增的目标消息和发送状态，不能仅凭输入框清空判成功。结果不明先观察，禁止重发。
    steps:
      - ["set-clipboard", "{text}"]
      - ["click", "id:chat_input_field", "--app", "{window}"]
      - ["press", "ctrl+v", "--target", "id:chat_input_field", "--app", "{window}"]
      - ["get", "id:chat_input_field", "--app", "{window}", "--property", "value"]
      - ["find", "--name", "发送", "--app", "{window}"]
      - ["click", "{send_ref}", "--app", "{window}", "--physical", "--snapshot", "{send_snapshot_id}"]
      - ["get", "id:chat_input_field", "--app", "{window}", "--property", "value"]
      - ["snapshot", "--app", "{window}"]
  - id: search_conversation
    description: 会话搜索(搜索框 Edit 聚焦后 paste;esc 退出)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["set-clipboard", "{query}"]
      - ["find", "--name", "搜索", "--role", "Edit", "--app", "{window}"]
      - ["click", "{search_ref}", "--app", "{window}", "--snapshot", "{search_snapshot_id}"]
      - ["press", "ctrl+v", "--app", "{window}", "--target", "{search_ref}", "--snapshot", "{search_snapshot_id}"]
      - ["snapshot", "--app", "{window}"]
      - ["press", "escape", "--app", "{window}"]
  - id: send_file
    description: 发送文件(选择文件对话框:文件名 ComboBox 子 Edit paste 全路径 → Alt+O 确认)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    verify: Alt+O 前核对文件路径读回、文件归属与目标会话；之后核对本次文件消息、文件名/大小与发送状态。失败或不确定时保留现场，不重发。
    steps:
      - ["find", "--name", "发送文件", "--app", "{window}"]
      - ["click", "{sendfile_ref}", "--app", "{window}", "--physical", "--snapshot", "{sendfile_snapshot_id}"]
      - ["wait", "--window", "选择文件", "--timeout", "4000"]
      - ["find", "--target", "uia:{\"match\":{\"role\":\"Edit\"},\"within\":{\"id\":\"1148\",\"role\":\"ComboBox\"}}", "--app", "选择文件"]
      - ["click", "uia:{\"match\":{\"role\":\"Edit\"},\"within\":{\"id\":\"1148\",\"role\":\"ComboBox\"}}", "--app", "选择文件"]
      - ["set-clipboard", "{file_path}"]
      - ["press", "ctrl+v", "--app", "选择文件", "--target", "uia:{\"match\":{\"role\":\"Edit\"},\"within\":{\"id\":\"1148\",\"role\":\"ComboBox\"}}"]
      - ["get", "uia:{\"match\":{\"role\":\"Edit\"},\"within\":{\"id\":\"1148\",\"role\":\"ComboBox\"}}", "--property", "value", "--app", "选择文件"]
      - ["press", "alt+o", "--app", "选择文件", "--target", "uia:{\"match\":{\"role\":\"Edit\"},\"within\":{\"id\":\"1148\",\"role\":\"ComboBox\"}}"]
  - id: contacts_browse
    description: 通讯录(导航 → 列表+分组统计 → 点联系人读详情 → esc + 发现锚点回聊天)
    status: verified
    steps:
      - ["click", "name:通讯录", "--app", "{window}", "--physical"]
      - ["snapshot", "--app", "{window}"]
      - ["click", "name:{contact}", "--app", "{window}", "--physical"]
      - ["snapshot", "--app", "{window}"]
      - ["press", "escape", "--app", "{window}"]
      - ["click", "name:微信", "--app", "{window}", "--near", "name:发现", "--physical"]
  - id: mention_member
    description: >-
      @人(群输入 @ → 选择器 UIA 可见按名点选;@引用是 U+FFFC 内嵌对象,Value 读回非纯文本;不发送)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["click", "id:chat_input_field", "--app", "{window}"]
      - ["set-clipboard", "@"]
      - ["press", "ctrl+v", "--target", "id:chat_input_field", "--app", "{window}"]
      - ["snapshot", "--app", "{window}"]
      - ["click", "name:{member}", "--app", "{window}", "--physical"]
  - id: group_info
    description: 群信息面板(群名+成员数;深读成员列表用 wechat-ui-collector)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["find", "--name", "聊天信息", "--app", "{window}"]
      - ["click", "{info_ref}", "--app", "{window}", "--physical", "--snapshot", "{info_snapshot_id}"]
      - ["snapshot", "--app", "{window}"]
      - ["press", "escape", "--app", "{window}"]
  - id: read_image_message
    description: 图片消息内容读取(UIA 失明兜底:截图+视觉模型;须先打开含图会话)
    # 原路线曾有真机证据；以下步骤已修订，2026-09-29 尚未复验。
    status: manual
    steps:
      - ["snapshot", "--app", "{window}", "--skeleton"]
      - ["screenshot", "--element", "{bubble_selector}", "--sapp", "{window}"]
      # 之后的视觉模型调用由上层 agent 完成(把 PNG 路径喂给多模态)
  - id: capture_context_menu
    description: 右键菜单捕获(菜单是 mmui overlay,UIA 不可见;截 point 右下区域给视觉)
    # 修正旧示例不支持的 --physical 参数；right-click 本身是物理操作，待复验。
    status: manual
    steps:
      - ["right-click", "{target}", "--app", "{window}"]
      - ["screenshot", "--rect", "{menu_x},{menu_y},{menu_w},{menu_h}"]
      - ["press", "escape", "--app", "{window}"]
