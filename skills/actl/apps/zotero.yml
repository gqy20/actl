pack_format: 1
name: zotero
display: Zotero
launch: zotero
window: "hwnd:{hwnd}"
app_version: "10.0.3"
verified_date: 2026-09-28
verified_env: Win11 25H2 (build 26200) zh-cn
quirks:
  - id: search_commit_semantics
    note: 快速搜索框 type 为追加语义（需先 click 聚焦 + ctrl+a 全选才替换）;输入即实时过滤、tab 提交会清空框与过滤;裸 press 间歇被首启升级通知条（sync-reminder）挡。workflow 用 click+ctrl+a+type 三段。全新 profile 首启有「升级到 Zotero 10」通知条，不挡输入但拖慢首个动作。
  - id: dialog_selector_ambiguity
    note: publication 字段须精确 name 匹配（集合树「我的出版物」可编辑行使 name_contains 歧义）;导出格式列表项须 role=ListItem 限定（弹出 List 自身显示当前选中值同名）;Windows 保存对话框跑在 contentproc 子进程（命令行无 profile 令牌，verify-owner 不可用）;保存文件名框拒收正斜杠路径（须反斜杠）。
  - id: datadir_backslash_required
    note: Zotero 10 的 -datadir 只接受反斜杠绝对路径或字面量 profile，正斜杠路径（引擎 ${run.dir} 默认正斜杠）会弹「错误」对话框（-datadir requires an absolute path or 'profile'）且不建主窗口——用 ${run.dir_native} 反斜杠变体。-profile 不受影响，正斜杠可用。
  - id: window_title_disambiguation
    note: --app "Zotero" 会被浏览器内 Zotero 网页签（如「Zotero | Your personal research assistant - Google Chrome」）歧义命中;主窗锚用「我的文库 - Zotero」（全新隔离 profile 的主窗口标题）。用户同时开着真实 Zotero 时仍会歧义，届时护栏会如实报 AMBIGUOUS，不静默选错。
  - id: workflow_migration
    note: 业务步骤及隔离资源声明均在 workflows;直接 flow-run --file 对应模板 --id 新任务ID，无需准备脚本或输入文件。独立文件及进程归属核验已接入。
  - id: import_readback_correction
    note: 只读数据库核对证明 RIS 文献可正确落库;界面可能未暴露预期条目行——不能重放导入,须核对列表视图与截图。搜索导出仍未验收。
  - id: current_execution_contract
    note: 每次 find 后将选定元素的完整 ref 与同次 snapshot_id 成对保存；第二次搜索定位使用 fresh_search_ref/fresh_search_snapshot_id。publication/filename 使用各自前缀；set-value 后读回必须等于新路径。窗口枚举失败立即停止，不把失败当作没有窗口。
  - id: export_dialog_ids
    note: 文件菜单用 id:fileMenu。导出另存为是独立进程的系统对话框，按新 HWND、owner_title、class 核对；数字 ID 1001/1 与工具栏/文件行重复，文件名用 find 限定 Edit，保存用 name:保存(S)。
  - id: search_value_unavailable
    note: 空搜索框 get value 返回空 properties 不足以证明搜索恢复;非空搜索词可从 Value/Text 通道读回,核验以实际条目行为准。
  - id: dynamic_refs
    note: 通知栏会插入 Edit，连 find 与 get 之间 ref 都可能漂移。写入用 --snapshot 绑定 ref、type 加 --verify-value、提交/清空用 press --target;读回须核对 name=快速搜索、role=Edit 和文本，必要时重新 find。不能把旧 ref 当作持久 ID；本 pack 的写入仅在独立测试库验证。
  - id: reader_text_scope
    note: Zotero Reader 的 text 是阅读器工具栏和页码信息，不能当作 PDF 正文提取能力。
routes:
  - id: observe
    description: 确认 HWND 后读取文献库及阅读器界面结构
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: edit_publication_test_item
    description: 独立测试库中选中已核对的合成条目，find 出版物/Edit 后必须再按 name 精确等于出版物过滤，排除我的出版物
    status: manual
    verify: Tab 提交后通过 UI 导出 CSL JSON，核对唯一条目的 title、container-title 和 author；不把旧 ref 读回作为落库证据。完整脚本 workflows/zotero-search.yml。
    steps:
      - ["find", "--name", "出版物", "--role", "Edit", "--app", "{window}"]
      - ["type", "{publication_ref}", "{publication}", "--paste", "--app", "{window}", "--snapshot", "{publication_snapshot_id}", "--verify-value", "{publication}"]
      - ["press", "tab", "--app", "{window}", "--target", "{publication_ref}", "--snapshot", "{publication_snapshot_id}"]
      - ["right-click", "{owned_item_selector}", "--app", "{window}"]
      - ["click", "name:导出条目", "--app", "{window}"]
      - ["list-windows"]
  - id: export_csl_json
    description: 导出格式窗口选择 CSL JSON，再在独立系统保存窗口填写唯一新路径；HWND 均重新观察获取
    status: manual
    verify: 等待文件完整并解析为 JSON，核对条目数量和关键字段，不以保存按钮 ok 判成功。
    steps:
      - ["click", "id:format-menu", "--app", "hwnd:{format_hwnd}"]
      - ["click", "name:CSL JSON", "--app", "hwnd:{format_hwnd}"]
      - ["click", "name:OK", "--app", "hwnd:{format_hwnd}"]
      - ["list-windows"]
      - ["find", "--name", "文件名:", "--role", "Edit", "--app", "hwnd:{save_hwnd}"]
      - ["set-value", "{filename_ref}", "{new_export_path}", "--app", "hwnd:{save_hwnd}", "--snapshot", "{filename_snapshot_id}"]
      - ["get", "{filename_ref}", "--property", "value", "--snapshot", "{filename_snapshot_id}", "--app", "hwnd:{save_hwnd}"]
      - ["click", "name:保存(S)", "--app", "hwnd:{save_hwnd}"]
  - id: locate_search
    description: 定位中文界面的快速搜索框，仅查找
    status: verified
    verify: elements 唯一且角色为 Edit；不代表 ValuePattern 可用
    steps:
      - ["find", "--name", "快速搜索", "--role", "Edit", "--app", "{window}"]
  - id: search_test_library
    description: 独立测试库中搜索；从刚执行的 find 取唯一 search_ref，初始搜索须为空
    status: manual
    verify: 搜索后核对条目 TreeItem 集合，再重新 find 并核对搜索框名称、角色与 text；清空后原始条目集合必须恢复。完整脚本 workflows/zotero-search.yml
    steps:
      - ["find", "--name", "快速搜索", "--role", "Edit", "--app", "{window}"]
      - ["type", "{search_ref}", "{query}", "--paste", "--app", "{window}", "--snapshot", "{search_snapshot_id}", "--verify-value", "{query}"]
      - ["snapshot", "--app", "{window}"]
      - ["find", "--name", "快速搜索", "--role", "Edit", "--app", "{window}"]
      - ["get", "{fresh_search_ref}", "--property", "text", "--app", "{window}", "--snapshot", "{fresh_search_snapshot_id}"]
      - ["press", "ctrl+a", "--app", "{window}", "--target", "{fresh_search_ref}", "--snapshot", "{fresh_search_snapshot_id}"]
      - ["press", "backspace", "--app", "{window}", "--target", "{fresh_search_ref}", "--snapshot", "{fresh_search_snapshot_id}"]
      - ["snapshot", "--app", "{window}"]
