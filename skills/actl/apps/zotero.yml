pack_format: 1
name: zotero
display: Zotero
launch: zotero
window: "hwnd:{hwnd}"
app_version: "10.0.3"
verified_date: 2026-10-12
verified_env: Win11 25H2 (build 26200) zh-cn
quirks:
  - id: search_commit_semantics
    note: 快速搜索框 type 为追加语义（需先 click 聚焦 + ctrl+a 全选才替换）;输入即实时过滤、tab 提交会清空框与过滤;裸 press 间歇被首启升级通知条（sync-reminder）挡。workflow 用 click+ctrl+a+type 三段。全新 profile 首启有「升级到 Zotero 10」通知条，不挡输入但拖慢首个动作。
  - id: dialog_selector_ambiguity
    note: publication 字段须精确 name 匹配（集合树「我的出版物」可编辑行使 name_contains 歧义）;导出格式列表项须 role=ListItem 限定（弹出 List 自身显示当前选中值同名）;Windows 保存对话框跑在 contentproc 子进程（命令行无 profile 令牌，verify-owner 不可用）;保存文件名框拒收正斜杠路径（须反斜杠）。
  - id: datadir_backslash_required
    note: Zotero 10 的 -datadir 只接受反斜杠绝对路径或字面量 profile，正斜杠路径（引擎 ${run.dir} 默认正斜杠）会弹「错误」对话框（-datadir requires an absolute path or 'profile'）且不建主窗口——用 ${run.dir_native} 反斜杠变体。-profile 不受影响，正斜杠可用。
  - id: window_title_disambiguation
    note: --app "Zotero" 会被浏览器内 Zotero 网页签（如「Zotero | Your personal research assistant - Google Chrome」）歧义命中;主窗锚用「我的文库 - Zotero」（全新隔离 profile 的主窗口标题）。用户同时开着真实 Zotero 时仍会歧义，届时护栏会如实报 AMBIGUOUS，不静默选错。
  - id: workflow_migration
    note: 业务步骤及隔离资源声明均在 workflows;直接 flow-run --file 对应模板 --id 新任务ID，无需准备脚本或输入文件。独立文件及进程归属核验已接入。
  - id: exploration_isolation
    note: 隔离策略:**single-instance,隔离不可行**——-datadir 指向独立数据目录会转发给既有实例(不出新窗),探索写入直接走真实实例+测试条目协议(PACKS.md):标记名条目+前后 find 核对+白名单删除+residue-report 收尾;写验证已在真实库与独立测试库双轨完成。
  - id: import_readback_correction
    note: RIS 导入(剪贴板)与条目导出已在真实库实证闭环——导入后列表视图出现条目行,导出产物落盘且字段与导入一致,不能重放导入当证据,须核对列表视图与产物文件。
  - id: current_execution_contract
    note: 每次 find 后将选定元素的完整 ref 与同次 snapshot_id 成对保存；第二次搜索定位使用 fresh_search_ref/fresh_search_snapshot_id。publication/filename 使用各自前缀；set-value 后读回必须等于新路径。窗口枚举失败立即停止，不把失败当作没有窗口。
  - id: export_dialog_ids
    note: 文件菜单用 id:fileMenu(导入…/从剪贴板导入在此)。条目级导出/删除走**条目右键菜单**(菜单项是主窗 UIA 树内 MenuItem,非独立 HWND——「导出条目…」「删除条目…」都在,右键后重新 snapshot 取 ref)。导出格式窗是 Zotero 自有窗(标题「导出…」),格式下拉 id:format-menu 默认停在**上次使用的格式**(装 Better BibTeX 时默认 bib——要目标格式必须显式选);确定按钮 name:OK(英文)。另存为是独立进程系统对话框:文件名 Edit id:1001、保存按钮 name:保存(S);**Windows 按保存类型过滤器补扩展名**(输入名不以过滤器扩展结尾就追加——文件名与格式类型必须成对核对产物后缀)。
  - id: save_dialog_filename_channel
    note: 系统另存对话框文件名 Edit 的 get value 读回恒空(通道失明),set-value+读回核验不可用——文件名写入走 **type --paste --verify-value**(焦点核验+值验证)。写入后保存按钮可能 STALE_REF(对话框回流重排)——按 hint 重新 snapshot 后文件名内容保留,直接点新 ref 的保存按钮。
  - id: search_value_unavailable
    note: 空搜索框 get value 返回空 properties 不足以证明搜索恢复;非空搜索词可从 Value/Text 通道读回,核验以实际条目行为准。
  - id: dynamic_refs
    note: 通知栏会插入 Edit，连 find 与 get 之间 ref 都可能漂移。写入用 --snapshot 绑定 ref、type 加 --verify-value、提交/清空用 press --target;读回须核对 name=快速搜索、role=Edit 和文本，必要时重新 find。不能把旧 ref 当作持久 ID；写入已在独立测试库与真实库(测试条目+清理还原)双验证。
  - id: reader_text_scope
    note: Zotero Reader 的 text 是阅读器工具栏和页码信息，不能当作 PDF 正文提取能力。
  - id: pdf_reader_focus_trap
    note: **PDF 阅读页焦点陷阱**:pdf.js 内嵌文档劫持键盘焦点——文库工具栏元素(快速搜索 Edit)的 UIA SetFocus 读回不符(focus 原语 NOT_ACTIONABLE focus_readback_mismatch 实证,焦点仍在 PDF Page 元素)。文库视图切回后恢复。UIA Invoke 也不转移键盘焦点(click ok 焦点不变,Firefox a11y 特性)——需要键盘焦点的动作先走 focus 原语并核验读回。
  - id: quick_search_dual_match_and_setvalue
    note: 快速搜索双命中:name:快速搜索 同时匹配「快速搜索模式」Button(zotero-tb-search-menu-button)与搜索 Edit——复合选择器 `uia:{"match":{"role":"Edit","name":"快速搜索"}}` 精确锁定。搜索框写入走 **set-value**(ValuePattern 可写,无需键盘焦点,读回确认;type 键盘通道依赖焦点——见 pdf_reader_focus_trap);esc 清空恢复。
  - id: tabs_menu_navigation
    note: 顶部标签条:主 TabItem name 随文档变化不定位;**「列出所有标签页」按钮(zotero-tb-tabs-menu)点开下拉,标签 ListItems 全带名称可点**(含「关闭标签页」后缀);左侧栏「我的文库」Button 切回文库视图。注意:PDF 标签页聚焦时 esc 会关闭论文标签页(库数据不受影响)。
  - id: new_item_creation_route
    note: 新建条目→点击「期刊文章」→右侧条目详情面板暴露完整字段(标题/作者/分册标题/系列标题/短标题等全可 set-value+读回)。**删除走选中→Delete→确认对话框**(标题「移动到回收站」,MozillaDialogClass 独立窗,按钮「OK」——Firefox 系对话框按钮名是英文不是中文;删除后 find 条目名应空返回)。文件菜单随标签页上下文变化:PDF 标签页的文件菜单是 PDF 专属项(导入注释/另存为),**文库导入导出走文库视图的文件菜单或条目右键菜单**。
  - id: uia_tree_exposure_good
    note: Zotero 7(Firefox 系)UIA 暴露良好——PDF 阅读页 711 元素全树物化(页码跳转 pageNumber/缩略图列表/条目详情/标签条 tab-bar-container 全可定位);不是盲区,可直接 snapshot 探面。大库(千条级)全窗 find/快照耗时显著,定位条目优先名称子串 find,避免全树遍历后过滤。
routes:
  - id: observe
    description: 确认 HWND 后读取文献库及阅读器界面结构
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
  - id: edit_publication_test_item
    description: 独立测试库中选中已核对的合成条目，find 出版物/Edit 后必须再按 name 精确等于出版物过滤，排除我的出版物
    status: manual
    verify: Tab 提交后通过 UI 导出 CSL JSON，核对唯一条目的 title、container-title 和 author；不把旧 ref 读回作为落库证据。完整脚本 workflows/zotero-search.yml。
    steps:
      - ["find", "--name", "出版物", "--role", "Edit", "--app", "{window}"]
      - ["type", "{publication_ref}", "{publication}", "--paste", "--app", "{window}", "--snapshot", "{publication_snapshot_id}", "--verify-value", "{publication}"]
      - ["press", "tab", "--app", "{window}", "--target", "{publication_ref}", "--snapshot", "{publication_snapshot_id}"]
      - ["right-click", "{owned_item_selector}", "--app", "{window}"]
      - ["click", "name:导出条目", "--app", "{window}"]
      - ["list-windows"]
  - id: export_csl_json
    description: 选中条目右键导出,格式窗显式选目标格式,系统另存窗写入唯一新路径(反斜杠),产物文件核对字段
    status: manual
    verify: 等待产物文件出现并解析,核对条目字段与库内一致+后缀与格式类型成对;不以保存按钮 ok 判成功。文件名写走 type --paste --verify-value(get value 通道失明,见 save_dialog_filename_channel);保存按钮 STALE_REF 时重新 snapshot 后点新 ref。导入→导出全链已在真实库实证(bib 默认格式轮)。
    steps:
      - ["right-click", "{item_selector}", "--app", "{window}"]
      - ["snapshot", "--app", "{window}"]
      - ["click", "name:导出条目…", "--app", "{window}", "--snapshot", "{menu_snapshot_id}"]
      - ["click", "id:format-menu", "--app", "hwnd:{format_hwnd}"]
      - ["click", "name:CSL JSON", "--app", "hwnd:{format_hwnd}"]
      - ["click", "name:OK", "--app", "hwnd:{format_hwnd}"]
      - ["list-windows"]
      - ["find", "--name", "文件名:", "--role", "Edit", "--app", "hwnd:{save_hwnd}"]
      - ["type", "{filename_ref}", "{new_export_path_native}", "--paste", "--app", "hwnd:{save_hwnd}", "--snapshot", "{filename_snapshot_id}", "--verify-value", "{new_export_path_native}"]
      - ["click", "name:保存(S)", "--app", "hwnd:{save_hwnd}", "--snapshot", "{filename_snapshot_id}"]
  - id: locate_search
    description: 定位中文界面的快速搜索框，仅查找
    status: verified
    verify: elements 唯一且角色为 Edit；不代表 ValuePattern 可用
    steps:
      - ["find", "--name", "快速搜索", "--role", "Edit", "--app", "{window}"]
  - id: search_test_library
    description: 独立测试库中搜索；从刚执行的 find 取唯一 search_ref，初始搜索须为空
    status: manual
    verify: 搜索后核对条目 TreeItem 集合，再重新 find 并核对搜索框名称、角色与 text；清空后原始条目集合必须恢复。完整脚本 workflows/zotero-search.yml
    steps:
      - ["find", "--name", "快速搜索", "--role", "Edit", "--app", "{window}"]
      - ["type", "{search_ref}", "{query}", "--paste", "--app", "{window}", "--snapshot", "{search_snapshot_id}", "--verify-value", "{query}"]
      - ["snapshot", "--app", "{window}"]
      - ["find", "--name", "快速搜索", "--role", "Edit", "--app", "{window}"]
      - ["get", "{fresh_search_ref}", "--property", "text", "--app", "{window}", "--snapshot", "{fresh_search_snapshot_id}"]
      - ["press", "ctrl+a", "--app", "{window}", "--target", "{fresh_search_ref}", "--snapshot", "{fresh_search_snapshot_id}"]
      - ["press", "backspace", "--app", "{window}", "--target", "{fresh_search_ref}", "--snapshot", "{fresh_search_snapshot_id}"]
      - ["snapshot", "--app", "{window}"]
