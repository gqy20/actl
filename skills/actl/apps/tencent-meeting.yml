pack_format: 1
name: tencent_meeting
display: 腾讯会议
launch: wemeet           # app-registry 别名(已注册)→ D:\tools\Tecent\WeMeet\WeMeetApp.exe;非标准盘符安装,App Paths 未注册
window: "hwnd:{hwnd}"
app_version: "3.46.1.409"
verified_date: 2026-09-28
verified_env: Win11 25H2 (build 26200) zh-cn
quirks:
  - id: install_path_nonstandard
    note: 安装在 `D:\tools\Tecent\WeMeet\`(用户自选盘符,注意目录拼写 Tecent)——App Paths 注册表未注册、Program Files/LOCALAPPDATA 均无,开始菜单 `C:\ProgramData\...\Start Menu\Programs\腾讯会议\腾讯会议.lnk` 是唯一系统入口。**探测通道教训(2026-10-12)**:曾因只查 App Paths/Program Files/LOCALAPPDATA 误判「本机未安装」——软件探测标准序必须含开始菜单 .lnk 解析(WScript.Shell CreateShortcut 读 TargetPath);别名 wemeet 已注册 app-register,`actl launch wemeet` 直达。
  - id: launch_bootstrap_handoff
    note: launch 派生的 pid 是 bootstrap,真窗口进程 pid 不同(交接形态)——spawned_pid 不作窗口归属判据。启动期 UIA 观察可能撞 0x80040201(事件无订户)瞬态:launch --wait-window 一体形态会如实失败,窗口就绪判定用分离式 `wait --window 腾讯会议`(notepad launch_resolution 同款纪律)。
  - id: background_helper_resident
    note: 窗口级优雅关闭后 WeMeetApp bootstrap(~22MB 无窗 helper)常驻属应用自身设计(同 cloudmusic 托盘形态)——勿 taskkill;窗口归属判定只看窗口,不看进程清零。
  - id: wmexternal_fail_fast_dialog
    note: WMExternal 辅助组件可能 fail-fast 崩溃,弹 `WMExternal.exe - Fail Fast Exception` 系统错误框(class #32770,topmost,内容「进程将立即终止」)——**可在主窗优雅关闭后滞留**(2026-10-12 实证:冒烟轮关闭后 helper 崩溃弹窗滞留)。处置=白名单清理动词:snapshot 该 hwnd 后点 `id:2 确定` 即消;判读纪律同 front-report(错误框不阻塞路线,但动手前先读全文确认是崩溃框非业务确认)。
  - id: current_execution_contract
    note: 确认框的 cancel_ref/cancel_snapshot_id 来自该确认框最新 snapshot，核对名称、角色和本任务会议。日期编辑只在已确认日期框焦点下继续。视觉坐标每次由当前截图确定，click 保留 --physical；多窗口按 HWND/PID/进程实例核对，窗口枚举错误不证明会议已经结束。
  - id: homepage_controls_missing
    note: 首页、会中工具栏、录制详情缺少可用 UIA 控件。先 snapshot，再按当前截图和窗口 rect 定位，hover 后截图核对，再显式 physical 点击。坐标必须由当前画面确定，不可复用。
  - id: separate_popups
    note: 快速会议下拉、录制确认、静音警告、结束确认可能是同标题的独立 HWND。弹出后 list-windows，核对 PID、class、rect，截图目标弹窗；仅截主窗会漏掉弹窗。
  - id: schedule_date_silent_write
    note: 开始日期 QDateEdit 的 set-value 返回成功但日期未变；type --paste 后 Ctrl+A、paste、Tab 可替换完整日期，已验证次日及跨月并精确读回。时间和时长经视觉点击验证;非 15 分钟粒度输入未测。方向键依赖当前选中年月日段，不得盲按。
  - id: refs_and_names
    note: 预定表单折叠日历后 ref 会变化，优先语义选择器。预定同时匹配 Text、Button 和标题；提交 Button 用完整 automation_id，先核对名称和角色。
  - id: download_handoff
    note: 详情右上更多→录制文件→单流录制下载会交给默认浏览器下载。下载页文字不代表完成，必须核验下载状态及实际文件；不复用带鉴权参数的 URL。
  - id: inputs_hwnd_prefix
    note: flow inputs 的窗口值必须写完整 "hwnd:<n>" 前缀——引擎不自动补,裸数字会被当标题子串解析(NOT_FOUND)。
routes:
  - id: observe
    description: 观察当前窗口；视觉步骤分阶段执行，不能作为盲跑批处理
    status: verified
    steps:
      - ["snapshot", "--app", "{window}"]
      - ["screenshot", "--app", "{window}"]
  - id: start_quick_meeting
    description: 确认入会麦克风/摄像头关闭、非个人会议号后，点击快速会议
    status: verified
    verify: 重新枚举会中 HWND 并核对 PID、进程实例与本任务会议身份，截图确认成员 1、解除静音、开启视频；结束后核对回到首页及本任务会议结束。仅 HWND 或 UIA 消失不能证明结束，枚举失败保留未知状态。
    steps:
      - ["focus-window", "--hwnd", "{hwnd}"]
      - ["hover", "xy:{quick_x},{quick_y}", "--app", "{window}"]
      - ["screenshot", "--app", "{window}"]
      - ["click", "xy:{quick_x},{quick_y}", "--app", "{window}", "--physical"]
      - ["list-windows"]
      - ["screenshot", "--app", "hwnd:{meeting_hwnd}"]
  - id: prepare_schedule
    description: 首页视觉打开预定窗口后，用 UIA 填主题并读回日期；workflows/tencent-meeting-draft.yml 留存检查;其他字段需截图核验
    status: verified
    verify: 主题精确匹配，日期等于预期；截图核对时间、时长、时区、重复、日历及空邀请，单独决定是否提交。
    steps:
      - ["snapshot", "--app", "hwnd:{schedule_hwnd}"]
      - ["set-value", "name:请输入会议主题", "{topic}", "--app", "hwnd:{schedule_hwnd}"]
      - ["verify", "--value", "name:请输入会议主题", "{topic}", "--app", "hwnd:{schedule_hwnd}"]
      - ["verify", "--value", "name:开始日期", "{expected_date}", "--app", "hwnd:{schedule_hwnd}"]
      - ["screenshot", "--app", "hwnd:{schedule_hwnd}"]
  - id: change_schedule_date
    description: 已观察的预定草稿内替换完整日期，日期使用 yyyy/M/d；不自动提交
    status: manual
    verify: Tab 后日期精确读回；提交前还必须检查其他预定字段。
    steps:
      - ["type", "name:开始日期", "{date}", "--paste", "--app", "hwnd:{schedule_hwnd}"]
      - ["press", "ctrl+a", "--app", "hwnd:{schedule_hwnd}", "--target", "name:开始日期"]
      - ["press", "ctrl+v", "--target", "name:开始日期", "--app", "hwnd:{schedule_hwnd}"]
      - ["press", "tab", "--app", "hwnd:{schedule_hwnd}", "--target", "name:开始日期"]
      - ["verify", "--value", "name:开始日期", "{date}", "--app", "hwnd:{schedule_hwnd}"]
  - id: choose_time_visual
    description: 时间下拉滚动后选择目标时间及时长（迁移待复验）。弹窗选项按当前截图确定，必要时滚动后重截图
    status: manual
    verify: 下拉收起后主表单截图显示目标时间；时长还需等待 Edit 值更新。没有 ValuePattern 时以截图终验，不能仅凭点击成功提交。
    steps:
      - ["click", "name:时间编辑框", "--app", "hwnd:{schedule_hwnd}"]
      - ["list-windows"]
      - ["screenshot", "--app", "hwnd:{time_popup_hwnd}"]
      - ["hover", "xy:{time_x},{time_y}", "--app", "hwnd:{time_popup_hwnd}"]
      - ["screenshot", "--app", "hwnd:{time_popup_hwnd}"]
      - ["click", "xy:{time_x},{time_y}", "--physical", "--app", "hwnd:{time_popup_hwnd}"]
      - ["screenshot", "--app", "hwnd:{schedule_hwnd}"]
  - id: submit_schedule
    description: 仅在预定表单各项与任务一致后提交一次
    status: verified
    verify: 等待预定成功窗口并核对首页唯一主题及时间；结果不明先查列表，不得重复提交。
    steps:
      - ["get", "id:QApplication.BaseDialog.DialogWidget.schedule_meeting_dialog_main_widget.QWidget.QFPushButton", "--app", "hwnd:{schedule_hwnd}"]
      - ["click", "id:QApplication.BaseDialog.DialogWidget.schedule_meeting_dialog_main_widget.QWidget.QFPushButton", "--app", "hwnd:{schedule_hwnd}"]
      - ["list-windows"]
      - ["screenshot", "--app", "{window}"]
  - id: cancel_test_schedule
    description: 仅清理本任务唯一测试预定；核对主题后视觉打开对应卡片更多菜单，再用 UIA 取消
    status: manual
    verify: 确认框中的取消按钮重新 snapshot 定位；确认后首页测试主题消失，原有会议保留。
    steps:
      - ["snapshot", "--app", "hwnd:{menu_hwnd}"]
      - ["click", "name:取消会议", "--app", "hwnd:{menu_hwnd}"]
      - ["list-windows"]
      - ["snapshot", "--app", "hwnd:{confirm_hwnd}"]
      - ["click", "{cancel_ref}", "--app", "hwnd:{confirm_hwnd}", "--snapshot", "{cancel_snapshot_id}"]
      - ["screenshot", "--app", "{window}"]
  - id: view_recording
    description: 视觉进入录制列表，按标题、日期和时长识别指定条目后打开；详情中视觉点击播放
    status: verified
    verify: 详情身份匹配且播放时间从 0 前进。未生成纪要不等于没有录制。
    steps:
      - ["hover", "xy:{recording_x},{recording_y}", "--app", "{window}"]
      - ["screenshot", "--app", "{window}"]
      - ["click", "xy:{recording_x},{recording_y}", "--app", "{window}", "--physical"]
      - ["screenshot", "--app", "{window}"]
      - ["hover", "xy:{play_x},{play_y}", "--app", "{window}"]
      - ["screenshot", "--app", "{window}"]
      - ["click", "xy:{play_x},{play_y}", "--app", "{window}", "--physical"]
      - ["screenshot", "--app", "{window}"]
  - id: download_recording
    description: 详情更多→录制文件后，核对单流录制行及大小，再点击该行下载；每层菜单均按视觉闭环单独观察
    status: verified
    verify: 默认浏览器下载完成且文件非空，用 ffprobe 读取真实媒体时长/编码并计算 SHA256。
    steps:
      - ["hover", "xy:{download_x},{download_y}", "--app", "{window}"]
      - ["screenshot", "--app", "{window}"]
      - ["click", "xy:{download_x},{download_y}", "--app", "{window}", "--physical"]
      - ["list-windows"]
      - ["snapshot", "--app", "hwnd:{browser_hwnd}"]
