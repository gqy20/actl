pack_format: 1
name: vmware
display: VMware Workstation(评测 VM 宿主)
launch: vmware            # App Paths 注册表解析;已 app-locate --register
window: "VMware Workstation"
app_version: "Workstation Pro 26H1u1 (build 25688693) / vmrun 1.17.0"
verified_date: 2026-10-13
verified_env: Win11 25H2 (build 26200) zh-cn
quirks:
  - id: vmrun_is_the_channel
    note: >-
      自动化主通道是 vmrun CLI 不是 UIA 点界面。26H1 实测完整语法:
      `vmrun -T ws -vp <vTPM加密密码> -gu <客机用户> -gp <客机密码> <子命令> <vmx> [args]`。
      三凭据缺一不可:-vp=向导 Configure Encryption 页设的 vTPM 密码(缺它报
      "A password is required");-gu/-gp=OOBE 本地账户(缺它报 "Command
      requires valid user name and password")。参数序陷阱:认证标志必须在
      子命令前;vmx 位置两类不一致——GUEST OS 类(runProgramInGuest/
      fileExistsInGuest/directoryExistsInGuest/copyFileFromGuestToHost/
      addSharedFolder)=子命令在前 vmx 在后;captureScreen=同序;vmx 放错
      报 "Unrecognized command: <vmx>"。runProgramInGuest 要完整程序路径
      (shell 内建不行),输出重定向类命令用 -noWait + 参数逐个传,或写结果
      到共享夹由宿主读回。captureScreen 截 guest 屏幕(1.5MB PNG 实测),
      PowerShell 复杂命令走 runProgramInGuest powershell.exe -Command。
      常用:revertToSnapshot(复位主通道:运行中调用=自动硬关机+revert,
      终态=建快照时的电源态,关机态快照后需 start 接力)/snapshot(关机态
      建=离线基线最干净)/deleteSnapshot(报错≠未生效,突变后 listSnapshots
      核验)/clone linked(多 lane)/addSharedFolder(跨边界主通道)。
  - id: snapshot_auth_strict_vvp
    note: >-
      vmrun 对 -vp 全命令类严格校验(错误密码在 Power/GUEST/snapshot 类
      一律 "Incorrect password"),无 GUI 凭据缓存顶包。认证失败先查调用
      形态再怀疑密码:宿主侧 vmrun 一律写 PS 脚本文件执行,禁 Bash 内联
      (内联转义污染曾致 snapshot 类认证失败并同窗伴生 UNC 反斜杠吞噬)。
      密码记录值即真值;向导密码框掩码点数≠字符长度,勿以点数反推。
  - id: offline_snapshot_headless_lock
    note: >-
      关机态 snapshot 命令先返回成功,但拉起的 headless vmware-vmx 进程
      持 vmx 配置锁短暂不释——紧跟的突变类操作(deleteSnapshot 等)可能
      报 "Cannot read the virtual machine configuration file";该报错
      ≠操作未生效(deleteSnapshot 实证:报此错但快照已删)。突变类操作
      (snapshot/deleteSnapshot/revertToSnapshot)后一律 listSnapshots
      或 .vmsd 核验实际状态再决定是否重放。
  - id: guest_ready_two_levels
    note: >-
      guest 就绪分两层:Tools 带外通道(start 后极快,fileExistsInGuest/
      runProgramInGuest Session 0 即通)远早于桌面就绪;-interactive 与
      依赖桌面的操作仍需用户已登录。评测 harness 的等待谓词=有界轮询
      fileExistsInGuest,不用裸 sleep;guest 固件不支持休眠,无 Fast
      Startup,每次都是真冷启。
  - id: guest_io_three_stage
    note: >-
      guest 复杂命令标准模式(实测 vmrun 通道的坑与正解):guest 程序的
      stdout **不回传** vmrun 管道(只回 exit code);多行 PowerShell 内联
      会被参数切分转义破坏。正解三段式=宿主写 .ps1 → copyFileFromHostToGuest
      灌入 → runProgramInGuest powershell -File <guest 本地路径> 执行
      (结果写 guest 本地文件) → copyFileFromGuestToHost 拉回宿主。
      runProgramInGuest 的程序路径必须完整(powershell 全路径
      C:\Windows\System32\WindowsPowerShell\v1.0\)。
  - id: hgfs_share_visibility
    note: >-
      共享夹在 guest 内的正确判读与两个假阴性陷阱(2026-10-13 排障实证):
      ①**宿主 Bash/工具层写含反斜杠的 .ps1 会被吃掉一个 `\`**(`\\vmware-host`
      落盘成 `\vmware-host`)——宿主写脚本走 Python/PowerShell 文件写入,
      Bash heredoc 内联必污染,AGENTS 转义纪律的又一实证;被污染的探测
      报"错误 67 找不到网络名"是假信号。②**runProgramInGuest 默认走
      Session 0**,HGFS UNC provider 挂在交互会话——服务会话内 Test-Path
      报 False 也是假阴性;-interactive 标志可指定交互会话(需用户已登录)。
      真实判读:UNC 地址栏 `\\vmware-host\Shared Folders\hostshare` 人工/
      Test-Path 可见全部文件=共享在线;`net use Z:` 映射盘符报"错误 64
      网络名不再可用"是 HGFS provider 不支持 net use 会话绑定的已知形态,
      **不代表共享故障**——日常用法走 UNC 地址或 vmrun copyFile 三段式,
      不依赖盘符映射。诊断共享在线性的机器通道=guest 内
      VMwareHgfsClient.exe(返回共享名清单,不受名字解析影响)。
  - id: version_probe_no_gui
    note: >-
      查版本不要用 `vmware.exe --version`——GUI 二进制不打印退出,会拉起
      主程序实例;用 `vmrun`(无参输出版本行)或安装目录只读探测。
  - id: toolbar_buttons_nameless
    note: >-
      主窗 UIA 树:菜单栏(File/Edit/View/VM/Tabs/Help)可达可 Invoke;
      工具栏 20+ 按钮全部无 name(自绘)——工具栏操作走 find-image 模板
      或菜单等价路径,不硬点。
  - id: service_family_resident
    note: >-
      vmware-authd/vmware-tray/vmware-usbarbitrator64 服务族是安装自启的
      正常常驻,收尾判定不按残留处理;清理只针对本任务开的 VM 窗口/实例。
  - id: guest_network_bridged
    note: >-
      Win11 guest 安装期 NAT 网络会卡"让我们连接到网络"且无法跳过——
      装 guest 时网卡选 Bridged;装完再按需改回 NAT(官方 workaround)。
      多网卡宿主(物理口未插线+VPN/虚拟适配器成堆)Bridged 自动选择器
      会桥到不可用适配器,guest 仅拿 169.254 APIPA——长周期评测 VM 用
      NAT 最稳:不依赖物理网卡在位,宿主换网/换地不用重配。NAT 网络在
      guest 判为 Public profile:需 host→guest 入站(MCP/诊断)时先
      Set-NetConnectionProfile 设 Private,ICMP 另加放行规则(默认不回
      ping 不代表链路不通——host→guest 的 TCP 入站按端口单独放行)。
  - id: whp_mode_host
    note: >-
      宿主 WSL2 常驻(HypervisorPresent=true)→ VMware 走 Host VBS Mode
      (WHP):嵌套虚拟化对 guest 不可用(guest 内不能再开 Hyper-V/WSL2);
      WHP 与原生模式间切换会使旧快照恢复失败(启动时 CPU 特性校验)——
      评测周期内不关 WSL2,切过就重建快照。
  - id: vmcli_permission_and_registration
    note: >-
      vmcli 非交互脚本面有双限制:`Power Start` 要求 __vmware__ 组或管理员;
      `ConfigParams SetEntry` 在 VM 有 vTPM 加密时报"getting password from
      stdin"失败(凭据只在 GUI 会话)。且 vmcli VM Create 产物**不进 GUI 库**
      (库树无条目、vmrun start 报通信中断)——建 VM 走 GUI 向导,vmcli 只
      用于读状态。
  - id: wizard_vtpm_encryption_step
    note: >-
      Win11 guest 引导向导在磁盘页后强制插"Configure Encryption"(vTPM 状态
      必须加密)。选 "Only the files needed to support a virtual TPM"(
      磁盘保持明文可被 harness 读写,仅 .nvram 加密);密码框 ValuePattern
      读回恒空属控件边界——用 set-value 写入(verify 会 ASSERTION_FAILED 但
      写入有效)或 type 后 tab 触发提交;两框长度须一致,不等则报
      "password cannot be empty"/不匹配。两处密码框 id 相同(9024/9025 在
      Configure Encryption 页,9024/9025 名字是 Password:/Confirm:)。
  - id: combo_value_needs_tab_commit
    note: >-
      Hardware 页的 "Number of processors"/"Number of cores" 是 ComboBox:
      对内部 Edit set-value 会返回 host_control:"ComboBox" 信号——直写
      不一定被宿主采纳(摘要栏不刷新);生效通道=type 值到内部 Edit 再
      press tab(焦点离开才提交),或点开 ComboBox 走 select。
      左侧 Device 摘要栏随之刷新方为生效。
  - id: selfdrawn_home_cards
    note: >-
      Home 页 "Create a New Virtual Machine"/"Open a Virtual Machine" 卡片
      是自绘:菜单栏的 Invoke 静默无效(画面零变化),必须 find-image 模板
      + click xy: --physical 兜底(模板裁剪注意窗口物理面≠渲染图,按
      find-image 回报的 window.width 换算,截图 --out 传 /tmp 会被 Windows
      解析到盘根,用默认落盘目录)。
  - id: bridged_is_default_no_key
    note: >-
      vmx 里没有 ethernet0.connectionType 键 = **bridged**(默认值不落键);
      只有非默认(NAT/custom)才显式写。核验网络模式看 GUI 的 Device 摘要
      栏或 vmrun,别以"键缺失"判 NAT。
routes:
  - id: main_window_observe
    description: 主窗 UIA 观察(菜单路径操作;工具栏见 toolbar_buttons_nameless)
    status: manual
    steps:
      - ["snapshot", "--app", "{window}"]
