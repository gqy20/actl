# 来源：docs/21-workflow-evaluation.md；docs/22-adaptation-test-infrastructure.md 输入方式对照。
pack_format: 1
name: calculator
display: Windows 计算器
launch: calc.exe
window: 计算器
app_version: "11.2607.0.0"
verified_date: 2026-09-27
verified_env: Windows 10.0.26200.0 zh-cn
quirks:
  - id: minimized_result_unavailable
    note: 2026-09-28 恢复护栏验收时，原生窗口确认计算器已最小化，精确 HWND 下 CalculatorResults 返回 NOT_FOUND。resume_check 因条件不满足阻止后续 run；不将该结果视为计算器进程退出，也不自动抢焦点。局部证据见 docs/39-flow-observation-recovery.md。
  - id: flow_title_lookup_stale
    note: 2026-09-28 输出绑定真机验收中，按窗口标题恢复 verify 遇到 STALE_REF（children）；同现场重新观察并限定 HWND 后 get/verify 与流程恢复通过。根因未定，不能吞掉错误或将其视为目标消失。精确句柄只用于当次已核实窗口，不硬编码到公共流程。证据见 docs/38-flow-output-bindings.md。
  - id: packaged_activation
    note: 直接执行包内 CalculatorApp.exe 可返回 PID 但不出现窗口；fixture 使用 AppsFolder 激活。list-windows 会同时列出宿主、标题栏和应用窗口，按包内程序路径、新 HWND 和进程启动时间确认测试实例。
  - id: result_name_channel
    note: CalculatorResults 的结果在 Name 通道，实测 verify --value 返回 actual=null。使用 verify --property name、get --property name 或 wait 的 name 谓词；中文界面的值为“显示为 5”等。
  - id: nested_output_not_resolved
    note: 本次快照包含 NormalOutput，但 get/wait 的语义定位返回 NOT_FOUND。优先使用 CalculatorResults，不把快照出现等同于选择器可定位。
routes:
  - id: keyboard_arithmetic_example
    description: 在中文标准模式下整段输入已验证算式，输入前清空当前计算
    status: verified
    verify: 同环境 3/3 次得到显示为 56,877；键盘 type 输入中位 913 ms。需使用独立测试实例或获准清空的计算器；其他算式及输入法状态需另验。
    steps:
      - ["click", "id:clearButton", "--app", "{window}"]
      - ["type", "id:num1Button", "123*456+789=", "--app", "{window}"]
      - ["verify", "--value", "id:CalculatorResults", "显示为 56,877", "--property", "name", "--app", "{window}"]
  - id: read_result
    description: 读取标准计算器的当前显示结果
    status: verified
    verify: 将名称中的结果与实际窗口截图核对；本次核对 2 与 5。
    steps:
      - ["get", "id:CalculatorResults", "--app", "{window}", "--property", "name"]
  - id: wait_expected_result
    description: 等待中文标准计算器显示预期结果
    status: verified
    verify: name 谓词精确匹配，超时表示结果未满足；本次未满足与满足分支均已验证。
    steps:
      - ["wait", "--element", "id:CalculatorResults", "--property", "name=显示为 {expected}", "--app", "{window}", "--timeout", "1000"]

  - id: assert_expected_result
    description: 立即核对中文标准计算器结果
    status: verified
    verify: Computer Use 点击 2 并截图确认后，Name 断言成功；显式 Value/Text 返回 actual=null。
    steps:
      - ["verify", "--value", "id:CalculatorResults", "显示为 {expected}", "--property", "name", "--app", "{window}"]
