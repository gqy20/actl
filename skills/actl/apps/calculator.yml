# 来源：docs/21-workflow-evaluation.md，Computer Use 实际点击与 CLI 只读断言联合验证。
pack_format: 1
name: calculator
display: Windows 计算器
launch: calc.exe
window: 计算器
app_version: "11.2607.0.0"
verified_date: 2026-09-27
verified_env: Windows 10.0.26200.0 zh-cn
quirks:
  - id: result_name_channel
    note: CalculatorResults 的结果在 Name 通道，实测 verify --value 返回 actual=null。使用 get --property name 或 wait 的 name 谓词；中文界面的值为“显示为 5”等。
  - id: nested_output_not_resolved
    note: 本次快照包含 NormalOutput，但 get/wait 的语义定位返回 NOT_FOUND。优先使用 CalculatorResults，不把快照出现等同于选择器可定位。
routes:
  - id: read_result
    description: 读取标准计算器的当前显示结果
    status: verified
    verify: 将名称中的结果与实际窗口截图核对；本次核对 2 与 5。
    steps:
      - ["get", "id:CalculatorResults", "--app", "{window}", "--property", "name"]
  - id: wait_expected_result
    description: 等待中文标准计算器显示预期结果
    status: verified
    verify: name 谓词精确匹配，超时表示结果未满足；本次未满足与满足分支均已验证。
    steps:
      - ["wait", "--element", "id:CalculatorResults", "--property", "name=显示为 {expected}", "--app", "{window}", "--timeout", "1000"]
