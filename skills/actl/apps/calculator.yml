pack_format: 1
name: calculator
display: Windows 计算器
launch: calc.exe
window: 计算器
app_version: "11.2607.0.0"
verified_date: 2026-10-03
verified_env: Win11 25H2 (build 26200) zh-cn
quirks:
  - id: current_execution_contract
    note: 按标题出现歧义或 provider 错误时保留原错误，重新观察并绑定已确认 HWND；不要把窗口清单失败当作计算器未启动。算式输入仅在标准模式及获准清空的实例运行，结果仍从 CalculatorResults 的 Name 通道核验。
  - id: minimized_result_unavailable
    note: 计算器最小化时，精确 HWND 下 CalculatorResults 返回 NOT_FOUND，resume_check 会因条件不满足阻止后续 run；不将该结果视为计算器进程退出，也不自动抢焦点。
  - id: flow_title_lookup_stale
    note: 按窗口标题恢复 verify 可能遇 STALE_REF（children），显示端扰动下也会出现元素级瞬态 NOT_FOUND——同现场重新观察并限定 HWND 后恢复；不能吞掉错误或将其视为目标消失。精确句柄只用于当次已核实窗口，不硬编码到公共流程。
  - id: packaged_activation
    note: 直接执行包内 CalculatorApp.exe 可返回 PID 但不出现窗口；用 AppsFolder 激活。list-windows 会同时列出宿主、标题栏和应用窗口，按包内程序路径、新 HWND 和进程启动时间确认测试实例。
  - id: result_name_channel
    note: CalculatorResults 的结果在 Name 通道，verify --value 返回 actual=null。使用 verify --property name、get --property name 或 wait 的 name 谓词；中文界面的值为“显示为 5”等。
  - id: nested_output_not_resolved
    note: 快照里出现的 NormalOutput 不保证 get/wait 语义定位可解析。优先使用 CalculatorResults，不把快照出现等同于选择器可定位。
routes:
  - id: keyboard_arithmetic_example
    description: 在中文标准模式下整段输入已验证算式，输入前清空当前计算
    status: verified
    verify: 结果显示为 56,877。需使用独立测试实例或获准清空的计算器；其他算式及输入法状态需另验。
    steps:
      - ["click", "id:clearButton", "--app", "{window}"]
      - ["type", "id:num1Button", "123*456+789=", "--app", "{window}"]
      - ["verify", "--value", "id:CalculatorResults", "显示为 56,877", "--property", "name", "--app", "{window}"]
  - id: read_result
    description: 读取标准计算器的当前显示结果
    status: verified
    verify: name 通道读回即当前显示值。
    steps:
      - ["get", "id:CalculatorResults", "--app", "{window}", "--property", "name"]
  - id: wait_expected_result
    description: 等待中文标准计算器显示预期结果
    status: verified
    verify: name 谓词精确匹配，超时表示结果未满足。
    steps:
      - ["wait", "--element", "id:CalculatorResults", "--property", "name=显示为 {expected}", "--app", "{window}", "--timeout", "1000"]
  - id: assert_expected_result
    description: 立即核对中文标准计算器结果
    status: verified
    verify: Name 断言可用；显式 Value/Text 通道返回 actual=null。
    steps:
      - ["verify", "--value", "id:CalculatorResults", "显示为 {expected}", "--property", "name", "--app", "{window}"]
  - id: explore_explore_s1_calc_auto
    description: 让计算器显示包含数字七（探索回写）
    status: verified
    verify: "目标断言:verify --value id:CalculatorResults 显示为 7 --property name --app {window}"
    steps:
      - ["click", "id:num7Button", "--app", "{window}"]
      - ["verify", "--value", "id:CalculatorResults", "显示为 7", "--property", "name", "--app", "{window}"]
  - id: explore_explore_s2_calc_tie
    description: 让计算器显示包含数字七（探索回写，两步点击）
    status: verified
    verify: "目标断言:verify --value id:CalculatorResults 7 --property name --contains --app {window}"
    steps:
      - ["click", "id:num8Button", "--app", "{window}"]
      - ["click", "id:num7Button", "--app", "{window}"]
      - ["verify", "--value", "id:CalculatorResults", "7", "--property", "name", "--contains", "--app", "{window}"]
