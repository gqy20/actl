pack_format: 1
name: explorer
display: 文件资源管理器
launch: explorer.exe
window: "文件资源管理器"
app_version: "Win11 25H2 (build 26200) 内置"
verified_date: 2026-10-11
verified_env: Win11 25H2 (build 26200) zh-cn
quirks:
  - id: virtualized_list_provider_side
    note: 文件列表虚拟化是 provider 侧行为;ListItem 不物化,L4 ItemContainerPattern::FindItemByProperty 可精确命中未物化条目;collect 全量收集可用(空连两轮收敛)。三条边界——ItemContainer 枚举模式只盖物化窗会假报耗尽、滚动位置信号提前一页误报、起始位置依赖须复位到顶(docs/06 §3.4)。
  - id: dual_list_ambiguity
    note: 文件窗内恒有两个 List(「项目视图」内容列表 + TabListView 容器壳),role:List 必 AMBIGUOUS——用序数直选 role:List#1(项目视图,内容列表);collect/scroll/extract 同理。
  - id: close_by_hwnd_only
    note: explorer.exe 是 shell 进程(持任务栏/桌面),close-window --pid 会拒绝属安全巧合——一律按唯一标题或精确 hwnd 关;其窗口标题含完整路径(E:\...\dir - 文件资源管理器),路径变则标题变,hwnd 锚不随标题漂移。
  - id: navigation_pane_docked
    note: 导航窗格(automation_id:100,Tree)是常驻停靠面板非弹窗,不触发弹层门禁;窗口双 List 结构下 snapshot 建议带 --skeleton。
  - id: address_bar_xaml_form
    note: 地址栏实际形态 = `Edit name:地址栏 id=TextBox`(XAML 双态控件;调研的 view_1012 形态与 26200 不符,勿写死)。面包屑显示态下该 Edit 的 value **恒空**——不是路径读取通道;当前路径的确定性读取 = 窗口标题(全路径 + " - 文件资源管理器"后缀,strip 即得);面包屑按钮名是类名(PART_ItemButton)无路径文本。地址栏的用途是**写**(点击进入编辑态输入路径导航),不是读。
routes:
  - id: open_dir_and_collect_files
    description: 打开目录并全量收集文件列表(collect 有界收集,零注入)
    status: verified
    verify: "collect 返回 complete:true 且 truncation_reason 为空;条目数与目录实际一致(抽查末位文件在列)"
    steps:
      - ["launch", "--wait-window", "{window}", "explorer.exe", "{abs_dir}"]
      - ["collect", "role:List#1", "--role", "listitem", "--max-items", "2000", "--app", "{window}"]
  - id: find_file_by_exact_name
    description: 在(含未物化条目的)文件列表中按完整文件名查找——L4 虚拟化兜底
    status: verified
    verify: "find 返回 total>=1 且 resolved_by 为 item-container(未物化命中)或 primary(已物化)"
    steps:
      - ["find", "--name", "{file_name}", "--role", "listitem", "--app", "{window}"]
  - id: explore_navigate_back
    description: 点击导航栏后退按钮返回上一目录（探索回写）
    status: verified
    verify: "目标断言:wait --window 'tmp - 文件资源管理器' --timeout 8000(标题回到父目录)"
    steps:
      - ["click", "id:backButton", "--app", "{window}"]
      - ["wait", "--window", "tmp - 文件资源管理器", "--timeout", "8000"]
