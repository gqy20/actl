[package]
name = "actl-cli"
description = "actl: AI-native Windows desktop control CLI for agents - UIA-precise, JSON-verifiable, no screenshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
repository.workspace = true
keywords = ["windows", "automation", "cli", "agent", "rpa"]
categories = ["command-line-utilities"]

[dependencies]
actl-browser = { path = "../actl-browser", version = "0.2.1" }
actl-core = { path = "../actl-core", version = "0.2.1" }
actl-flow = { path = "../actl-flow", version = "0.2.1" }
actl-uia = { path = "../actl-uia", version = "0.2.1" }
clap = { version = "4.6.7", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
# decide 决策通道(仅该命令触达;同步阻塞 HTTP,ADR-001 兼容)
ureq.workspace = true

# bin 名 = actl(crate 名 actl-cli 仅用于 crates.io 发布,避免与被占的裸名冲突)
[[bin]]
name = "actl"
path = "src/main.rs"

[lints]
workspace = true
