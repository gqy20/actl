[package]
name = "actl-cli"
description = "actl: AI-native Windows desktop control CLI for agents - UIA-precise, JSON-verifiable, no screenshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
repository.workspace = true
keywords = ["windows", "automation", "cli", "agent", "rpa"]
categories = ["command-line-utilities"]

[dependencies]
actl-core = { path = "../actl-core", version = "0.1.4" }
actl-uia = { path = "../actl-uia", version = "0.1.4" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json.workspace = true

# bin 名 = actl(crate 名 actl-cli 仅用于 crates.io 发布,避免与被占的裸名冲突)
[[bin]]
name = "actl"
path = "src/main.rs"

[lints]
workspace = true
