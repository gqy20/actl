[package]
name = "actl-uia"
description = "Windows UIA backend: the ONLY crate allowed to touch COM/unsafe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
repository.workspace = true
keywords = ["windows", "uia", "automation", "accessibility"]
categories = ["os::windows-apis"]

[dependencies]
actl-core = { path = "../actl-core", version = "0.1.3" }
# M0 评估通过,升为正式依赖(docs/spike-findings.md);版本统一由根 Cargo.toml 管理(ADR-003)
uiautomation.workspace = true
serde_json.workspace = true
windows = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Variant"] }

[lints]
workspace = true
