# 浏览器 A1 spike:自研同步最小 CDP 客户端(设计见 docs/72)
# 独立工程,不并入根 workspace(依赖预算与登记只约束正式 crates)
[workspace]

[package]
name = "browser-rs-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
tungstenite = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# 与主仓发布口径一致(docs/PRD.md §4 NFR 对照实测用)
[profile.release]
lto = true
codegen-units = 1
strip = true
