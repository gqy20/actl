[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "TBD"
repository = "TBD"

# 版本统一声明点:windows crate 加入时必须且只能在这里(ADR-003)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }

# deny(而非 forbid)以保留 actl-uia 的唯一豁免点(AGENTS.md §5.5)
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# NFR 支撑:单二进制 <10MB、冷启动 <50ms(docs/PRD.md §4)
[profile.release]
lto = true
codegen-units = 1
strip = true
