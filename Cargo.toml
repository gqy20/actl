[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gqy20/actl"

# 版本统一声明点:windows crate 加入时必须且只能在这里(ADR-003)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# 浏览器深水层(用户授权 2026-10-13;spike 证据 prototypes/browser-lib-probe):
# chromiumoxide 全域类型化 CDP,许可面干净(MIT OR Apache-2.0 全树);
# async 圈在 actl-browser 的 bridge 同步门面之后(ADR-001 修订,TECH_STACK §4)
chromiumoxide = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
futures = "0.3"
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_UI_Shell"] }
webview2-com = "=0.39.1"

# deny(而非 forbid)以保留 actl-uia 的唯一豁免点(AGENTS.md §5.5)
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# NFR 支撑:单二进制 <10MB、冷启动 <50ms(docs/PRD.md §4)
[profile.release]
lto = true
codegen-units = 1
strip = true
