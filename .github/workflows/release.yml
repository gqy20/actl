name: Release

# 发布体系参照 zotero_cli 的模式(tag 触发三段式);
# 差异:① msvc target 必须在 windows runner 原生构建 ② 不做 UPX(压缩解压损害冷启动 NFR)
# ③ 版本号来自 Cargo.toml(单源),无需注入。发布流程文档:docs/TECH_STACK.md §6

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (gate = CI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Quality gate (same single definition as CI / pre-push)
        run: cargo xtask gate

  build:
    name: Package windows/amd64
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin actl

      - name: Package and smoke test
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail

          # 冒烟:release 二进制必须可执行、正常退出(M1 后升级为 `actl status` / `actl commands`)
          ./target/release/actl.exe

          artifact_base="actl_${VERSION}_windows_amd64"
          mkdir -p "package/${artifact_base}" dist
          cp target/release/actl.exe "package/${artifact_base}/actl.exe"
          cp README.md "package/${artifact_base}/README.md" 2>/dev/null || true
          cp LICENSE "package/${artifact_base}/LICENSE" 2>/dev/null || true

          # Windows runner 用 PowerShell 打包(Compress-Archive 系统自带,不依赖 zip.exe)
          powershell -NoProfile -Command "Compress-Archive -Path 'package/${artifact_base}/*' -DestinationPath 'dist/${artifact_base}.zip'"

          # 同时发布裸 exe,便于直接下载使用
          cp target/release/actl.exe "dist/${artifact_base}.exe"

          ls -la dist/

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v tag="## [${GITHUB_REF_NAME}" \
            'index($0, "## [") == 1 { p = (substr($0, 1, length(tag)) == tag); next } p' \
            CHANGELOG.md > release_notes.md || true
          echo "--- extracted notes ---"; cat release_notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release_notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
          else
            echo "CHANGELOG has no section for ${GITHUB_REF_NAME}; falling back to generated notes" >&2
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
