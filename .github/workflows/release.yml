name: Release

# 发布体系参照 zotero_cli 的模式(tag 触发);
# 差异:① msvc target 必须在 windows runner 原生构建 ② 不做 UPX(压缩解压损害冷启动 NFR)
# ③ 版本号来自 Cargo.toml(单源),无需注入 ④ 打包与发布同 job 直传,不经 actions/artifact
# 中转(artifact 存储配额是账号级共享资源,2026-09-26 v0.1.0 发版实测被配额阻断)。
# 2026-10-13 v0.2.3 复盘两改:① verify 不再重跑 gate——main+tag 同推时 CI 已在跑同一
# SHA,等它的结论即可(失败即失败;查无 CI 的孤儿 tag 回落本地 gate);② crates.io 发布
# 按依赖分层并行 + --no-verify(CI 同 SHA 已全量验证,逐 crate verify 构建是发布耗时
# 大头)。
# 发布流程文档:docs/TECH_STACK.md §6

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tag 与 main 同推时 CI 已在跑同一 SHA——等结论而非重跑 gate(v0.2.3 实测
  # verify 重跑 14m38s 全程与 CI 重复)。CI 失败即发布失败;查无 CI run 的
  # 孤儿 tag(从非 main 提交打 tag)回落本地 gate,安全不降级。
  await-ci:
    name: Await CI on the same commit
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.await.outputs.outcome }}
    steps:
      - name: Poll CI conclusion for this SHA (up to 20 min)
        id: await
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=missing
          for i in $(seq 1 60); do
            line=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&workflow=ci.yml&per_page=1"               --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "pending")"' 2>/dev/null || echo "none pending")
            echo "poll $i: $line"
            if [ "${line%% *}" = "completed" ]; then
              outcome=${line#* }
              break
            fi
            sleep 20
          done
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [ "$outcome" = "failure" ] || [ "$outcome" = "cancelled" ]; then
            echo "::error::CI on ${GITHUB_SHA} concluded '$outcome' — refusing to release"
            exit 1
          fi
          # outcome=success → 发布继续;missing(无 CI run 的孤儿 tag)→ fallback-gate 兜底

  # 孤儿 tag 兜底:同 SHA 查无 CI run 时才跑本地 gate(main+tag 同推的常规路径整段跳过)
  fallback-gate:
    name: Fallback gate (orphan tag only)
    runs-on: windows-latest
    needs: await-ci
    if: needs.await-ci.outputs.outcome == 'missing'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/signal/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Quality gate (same single definition as CI / pre-push)
        run: cargo xtask gate

  crates:
    name: Publish to crates.io (real tags only)
    # 与 release job 并行:同一条 tag 同步发布 GitHub Release 与 crates.io
    runs-on: windows-latest
    needs: [await-ci, fallback-gate]
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/')
        && needs.await-ci.result == 'success'
        && (needs.fallback-gate.result == 'success' || needs.fallback-gate.result == 'skipped')
      }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Version guard (tag must equal Cargo.toml version)
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml v$ver — bump Cargo.toml before tagging"
            exit 1
          fi

      # 依赖分层并行 + --no-verify(CI 同 SHA 已全量验证——逐 crate 的
      # publish verify 构建是发布耗时大头,CI 驱动发布的标准姿态)。
      # 层间 settle 10s 等 crates.io 索引传播,层内依赖图:
      #   L0 core/mcp(互不依赖)→ L1 uia/flow(仅依赖 core)→
      #   L2 browser(core+uia)→ L3 cli(全量)。
      - name: 'Wave 1 — actl-core, actl-mcp (independent, parallel)'
        shell: bash
        run: |
          cargo publish -p actl-core --no-verify &
          cargo publish -p actl-mcp --no-verify &
          wait
      - name: Settle (registry index propagation)
        shell: bash
        run: sleep 10
      - name: 'Wave 2 — actl-uia, actl-flow (parallel)'
        shell: bash
        run: |
          cargo publish -p actl-uia --no-verify &
          cargo publish -p actl-flow --no-verify &
          wait
      - name: Settle (registry index propagation)
        shell: bash
        run: sleep 10
      - name: Wave 3 — actl-browser
        shell: bash
        run: cargo publish -p actl-browser --no-verify
      - name: Settle (registry index propagation)
        shell: bash
        run: sleep 10
      - name: Wave 4 — actl-cli
        shell: bash
        run: cargo publish -p actl-cli --no-verify

  release:
    name: Package and publish (windows/amd64)
    runs-on: windows-latest
    needs: [await-ci, fallback-gate]
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/')
        && needs.await-ci.result == 'success'
        && (needs.fallback-gate.result == 'success' || needs.fallback-gate.result == 'skipped')
      }}
    steps:
      - uses: actions/checkout@v7

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin actl --bin actl-signal --bin actl-mcp

      - name: Package and smoke test
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail

          # 冒烟:release 二进制必须正常执行核心只读命令(envelope 输出 + exit 0)。
          # 注意:裸跑 actl(缺子命令)是 clap 错误路径,退出码 2,不能当冒烟
          ./target/release/actl.exe status
          ./target/release/actl.exe commands
          # actl-mcp 冒烟走 --version(clap 元命令,人类文本/exit 0)
          ./target/release/actl-mcp.exe --version

          cargo xtask package --version "$VERSION" --binary-dir target/release --output dist

      # 产物归档(best-effort,永不阻塞):配额充足时归档供 workflow_dispatch
      # 演练下载核对;配额不足(账号级共享、删后 6-12h 才重算)自动跳过。
      # 发布产物不走 artifact——同 job 直传 Release(v0.1.0 曾被配额连续阻断)。
      - name: Upload packaged artifact (best-effort)
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64-${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
        continue-on-error: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          # CHANGELOG 按 Keep a Changelog 规范用无前缀版本号(## [0.1.0]),
          # 而 tag 带 v 前缀(v0.1.0)——匹配串必须剥掉 v,否则永远落空回退
          # 到 --generate-notes(v0.1.0 首发实测踩坑)
          ver="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${ver}" \
            'index($0, "## [") == 1 { p = (substr($0, 1, length(tag)) == tag); next } p' \
            CHANGELOG.md > changelog_section.md || true
          # 反换行(unwrap):CHANGELOG 为 diff 可读在条目内手工折行,而 GitHub
          # release 正文把 soft break 渲染成真换行(v0.1.5 实测:条目被拆行、
          # 右侧大片留白)。续行拼回前一行:ASCII 词间断行补空格,中文直接拼;
          # 标题/列表项/表格/引用行原样。
          awk '
            function flush() { if (held != "") { print held; held = "" } }
            function strip() { sub(/^[ \t]+/, "", $0) }
            /^$/ || /^#/ || /^\|/ || /^>/ { flush(); print; next }
            /^- / { flush(); held = $0; next }
            {
              strip()
              if (held == "") held = $0
              else if (held ~ /[A-Za-z0-9`.)\]]$/ && $0 ~ /^[A-Za-z0-9`([]/) held = held " " $0
              else held = held $0
            }
            END { flush() }
          ' changelog_section.md > changelog_unwrapped.md
          if [ -s changelog_section.md ]; then
            {
              echo "### 下载"
              echo
              echo "| 文件 | 说明 |"
              echo "|------|------|"
              echo "| \`actl_${GITHUB_REF_NAME}_windows_amd64.exe\` | Windows x64 主程序；桌面写操作需配套显示端 |"
              echo "| \`actl_${GITHUB_REF_NAME}_windows_amd64.zip\` | 完整包(actl + actl-signal + skills + README + LICENSE) |"
              echo "| \`checksums.txt\` | SHA-256 校验 |"
              echo
              cat changelog_unwrapped.md
            } > release_notes.md
          else
            echo "CHANGELOG has no section for ${GITHUB_REF_NAME}" > release_notes.md
          fi
          echo "--- extracted notes ---"; cat release_notes.md

      - name: Create release (real tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s changelog_section.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
          else
            echo "falling back to generated notes" >&2
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
