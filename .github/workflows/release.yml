name: Release

# 发布体系参照 zotero_cli 的模式(tag 触发);
# 差异:① msvc target 必须在 windows runner 原生构建 ② 不做 UPX(压缩解压损害冷启动 NFR)
# ③ 版本号来自 Cargo.toml(单源),无需注入 ④ 两段式:verify → release(打包与发布
# 同 job 直传,不经 actions/artifact 中转——artifact 存储配额是账号级共享资源,
# 2026-09-26 v0.1.0 发版实测被配额阻断,且删除后 6-12h 才重算)。
# 发布流程文档:docs/TECH_STACK.md §6

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (gate = CI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Quality gate (same single definition as CI / pre-push)
        run: cargo xtask gate

  crates:
    name: Publish to crates.io (real tags only)
    # 与 release job 并行:同一条 tag 同步发布 GitHub Release 与 crates.io
    runs-on: windows-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Version guard (tag must equal Cargo.toml version)
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml v$ver — bump Cargo.toml before tagging"
            exit 1
          fi

      # 按依赖序;crates.io 会拒绝重复版本(400),版本守卫已先行拦截 tag/版本错位
      - name: Publish actl-core
        run: cargo publish -p actl-core
      - name: Publish actl-uia
        run: cargo publish -p actl-uia
      - name: Publish actl-flow
        run: cargo publish -p actl-flow
      - name: Publish actl-cli
        run: cargo publish -p actl-cli

  release:
    name: Package and publish (windows/amd64)
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin actl --bin actl-signal

      - name: Package and smoke test
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail

          # 冒烟:release 二进制必须正常执行核心只读命令(envelope 输出 + exit 0)。
          # 注意:裸跑 actl(缺子命令)是 clap 错误路径,退出码 2,不能当冒烟
          ./target/release/actl.exe status
          ./target/release/actl.exe commands

          artifact_base="actl_${VERSION}_windows_amd64"
          mkdir -p "package/${artifact_base}" dist
          cp target/release/actl.exe "package/${artifact_base}/actl.exe"
          cp target/release/actl-signal.exe "package/${artifact_base}/actl-signal.exe"
          cp README.md "package/${artifact_base}/README.md" 2>/dev/null || true
          cp LICENSE "package/${artifact_base}/LICENSE" 2>/dev/null || true

          # Windows runner 用 PowerShell 打包(Compress-Archive 系统自带,不依赖 zip.exe)
          powershell -NoProfile -Command "Compress-Archive -Path 'package/${artifact_base}/*' -DestinationPath 'dist/${artifact_base}.zip'"

          # 同时发布裸 exe,便于直接下载使用
          cp target/release/actl.exe "dist/${artifact_base}.exe"

          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
          ls -la

      # 产物归档(best-effort,永不阻塞):配额充足时归档供 workflow_dispatch
      # 演练下载核对;配额不足(账号级共享、删后 6-12h 才重算)自动跳过。
      # 发布产物不走 artifact——同 job 直传 Release(v0.1.0 曾被配额连续阻断)。
      - name: Upload packaged artifact (best-effort)
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64-${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
        continue-on-error: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          # CHANGELOG 按 Keep a Changelog 规范用无前缀版本号(## [0.1.0]),
          # 而 tag 带 v 前缀(v0.1.0)——匹配串必须剥掉 v,否则永远落空回退
          # 到 --generate-notes(v0.1.0 首发实测踩坑)
          ver="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${ver}" \
            'index($0, "## [") == 1 { p = (substr($0, 1, length(tag)) == tag); next } p' \
            CHANGELOG.md > changelog_section.md || true
          # 反换行(unwrap):CHANGELOG 为 diff 可读在条目内手工折行,而 GitHub
          # release 正文把 soft break 渲染成真换行(v0.1.5 实测:条目被拆行、
          # 右侧大片留白)。续行拼回前一行:ASCII 词间断行补空格,中文直接拼;
          # 标题/列表项/表格/引用行原样。
          awk '
            function flush() { if (held != "") { print held; held = "" } }
            function strip() { sub(/^[ \t]+/, "", $0) }
            /^$/ || /^#/ || /^\|/ || /^>/ { flush(); print; next }
            /^- / { flush(); held = $0; next }
            {
              strip()
              if (held == "") held = $0
              else if (held ~ /[A-Za-z0-9`.)\]]$/ && $0 ~ /^[A-Za-z0-9`([]/) held = held " " $0
              else held = held $0
            }
            END { flush() }
          ' changelog_section.md > changelog_unwrapped.md
          if [ -s changelog_section.md ]; then
            {
              echo "### 下载"
              echo
              echo "| 文件 | 说明 |"
              echo "|------|------|"
              echo "| \`actl_${GITHUB_REF_NAME}_windows_amd64.exe\` | Windows x64 主程序,下载即用 |"
              echo "| \`actl_${GITHUB_REF_NAME}_windows_amd64.zip\` | 完整包(actl + actl-signal 状态条 + README + LICENSE) |"
              echo "| \`checksums.txt\` | SHA-256 校验 |"
              echo
              cat changelog_unwrapped.md
            } > release_notes.md
          else
            echo "CHANGELOG has no section for ${GITHUB_REF_NAME}" > release_notes.md
          fi
          echo "--- extracted notes ---"; cat release_notes.md

      - name: Create release (real tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s changelog_section.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
          else
            echo "falling back to generated notes" >&2
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
